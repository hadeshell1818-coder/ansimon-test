<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>소통실 상황관제</title>
<style>
:root{--navy:#17365d;--blue:#245d9c;--red:#c83b45;--amber:#d98218;--green:#27835b;--bg:#f4f6f8;--line:#dfe4e9;--ink:#18212b;--muted:#687583}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.hidden{display:none!important}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:20}.brand{font-weight:900;font-size:20px;color:var(--navy)}.who{font-size:12px;color:var(--muted)}.sp{flex:1}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.red{background:var(--red);color:#fff;border-color:var(--red)}.wrap{max-width:1240px;margin:22px auto;padding:0 18px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.hero h1{font-size:24px;margin:0 0 4px}.hero p{margin:0;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 3px 12px #2233440b}.card-head{display:flex;align-items:center;gap:10px}.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px}.voice .ico{background:#fff0f1}.call .ico{background:#edf5ff}.alert .ico{background:#fff6e9}.return .ico{background:#eaf8f1}.title{font-size:17px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:2px}.count{margin-left:auto;font-size:28px;font-weight:950}.count.red{color:var(--red)}.count.blue{color:var(--blue)}.count.green{color:var(--green)}.mini-list{margin-top:14px;border-top:1px solid #edf0f2}.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #edf0f2;cursor:pointer}.row:hover{background:#fafbfc}.row .main{flex:1;min-width:0}.row .main b{display:block;font-size:14px}.row .main span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{font-size:11px;font-weight:900;border-radius:999px;padding:5px 8px;background:#f1f3f5}.empty{padding:18px 0 4px;text-align:center;color:#8a949e;font-size:13px}.footer-actions{display:flex;gap:8px;margin-top:13px}.footer-actions .btn{flex:1}.return-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{background:#f7f9fa;border-radius:11px;padding:10px;text-align:center}.stat b{font-size:21px;display:block}.stat span{font-size:11px;color:var(--muted)}.wide{grid-column:1/-1}.historybar{display:flex;gap:8px;flex-wrap:wrap}.login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);padding:26px;border-radius:18px}.login h1{margin:0 0 5px}.login p{color:var(--muted);font-size:13px}.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:5px 0}.login button{width:100%;margin-top:8px}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:50;padding:30px 15px;overflow:auto}.modal.on{display:block}.sheet{max-width:720px;margin:auto;background:#fff;border-radius:18px;padding:20px}.sheet h2{margin:0 0 12px}.close{float:right}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px}.field textarea{min-height:86px;resize:vertical}.zones{display:flex;gap:6px;flex-wrap:wrap}.zones label{border:1px solid var(--line);padding:7px 9px;border-radius:9px;font-size:12px}.detailbox{background:#f7f9fa;border-radius:12px;padding:12px;margin:10px 0;font-size:13px;line-height:1.6}.danger{color:var(--red);font-weight:900}.ok{color:var(--green);font-weight:900}.cfgrow{display:grid;grid-template-columns:1fr 1.3fr 1fr auto;gap:6px;align-items:center;margin:7px 0}.cfgrow input,.cfgrow select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#17202a;color:#fff;padding:10px 16px;border-radius:999px;display:none;z-index:100}.toast.on{display:block}@media(max-width:760px){.grid{grid-template-columns:1fr}.return-stats{grid-template-columns:repeat(2,1fr)}.cfgrow{grid-template-columns:1fr}.top{padding:0 12px}.wrap{padding:0 10px}.hero{align-items:start;flex-direction:column;gap:8px}}
</style></head><body>
<div id="login" class="login hidden"><h1>소통실 상황관제</h1><p>소통실 계정으로 로그인하세요.</p><input id="lid" placeholder="아이디"><input id="lpw" type="password" placeholder="비밀번호"><div id="lerr" class="danger" style="font-size:12px"></div><button class="btn primary" onclick="doLogin()">로그인</button></div>
<div id="app" class="hidden"><header class="top"><div><div class="brand">안심ON · 소통실</div><div class="who" id="who"></div></div><div class="sp"></div><button class="btn" onclick="openConfig()">구역·집배원 관리</button><button class="btn primary" onclick="openEvidence()">통계·증빙 조회</button><button class="btn" onclick="logout()">로그아웃</button></header>
<main class="wrap"><div class="hero"><div><h1>상황관제</h1><p>첫 화면에는 지금 확인할 것만 표시합니다. 처리·발송 이력은 눌러서 확인하세요.</p></div><div id="today" class="sub"></div></div>
<div class="grid">
<section class="card voice"><div class="card-head"><div class="ico">🎙</div><div><div class="title">음성 위험신고</div><div class="sub">미처리 신고만 표시</div></div><div class="count red" id="voiceCount">0</div></div><div class="mini-list" id="voiceList"></div><div class="footer-actions"><button class="btn" onclick="openHistory('voice')">처리내역 보기</button></div></section>
<section class="card call"><div class="card-head"><div class="ico">☎</div><div><div class="title">관제실 통화내역</div><div class="sub">오늘 연결된 통화</div></div><div class="count blue" id="callCount">0</div></div><div class="mini-list" id="callList"></div><div class="footer-actions"><button class="btn" onclick="openHistory('call')">전체 통화내역</button></div></section>
<section class="card alert"><div class="card-head"><div class="ico">📣</div><div><div class="title">안전 알림 보내기</div><div class="sub">긴급 · 주의 · 전달말씀</div></div></div><div class="footer-actions"><button class="btn primary" onclick="openCompose()">새 알림 보내기</button><button class="btn" onclick="openHistory('alert')">보낸 내역</button></div></section>
<section class="card return"><div class="card-head"><div class="ico">✓</div><div><div class="title">업무종료 현황</div><div class="sub">전체 보고를 보존 · 상세 조회 가능</div></div><div class="count green" id="returnCount">0</div></div><div class="return-stats" id="returnStats"></div><div class="mini-list" id="issueList"></div><div class="footer-actions"><button class="btn" onclick="openReturns()">전체 업무종료 상세</button></div></section>
<section class="card wide"><div class="card-head"><div class="ico" style="background:#f2efff">📌</div><div><div class="title">공지사항</div><div class="sub">필요할 때 작성하고, 이력은 세부 화면에서 확인</div></div></div><div class="footer-actions" style="max-width:360px"><button class="btn primary" onclick="openNotice()">공지 작성</button><button class="btn" onclick="openHistory('notice')">공지 이력</button></div></section>
</div></main></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let token=sessionStorage.getItem('cv_safe_token')||null,me=null,S=null,H=null,R=null,C=null;
async function api(path,opts={}){opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});if(token)opts.headers.Authorization='Bearer '+token;const r=await fetch(path,opts);const d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error('다시 로그인하세요');}if(!r.ok)throw Error(d.error||'요청 실패');return d}function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1800)}function closeModal(){$('modal').classList.remove('on')}function modal(html){$('sheet').innerHTML='<button class="btn close" onclick="closeModal()">닫기</button>'+html;$('modal').classList.add('on')}
async function boot(){if(token)try{const d=await api('/api/me');if(d.user.kind==='safety'){me=d.user;return enter()}}catch(e){}$('login').classList.remove('hidden')}async function doLogin(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('lid').value.trim(),pw:$('lpw').value})});const d=await r.json();if(!r.ok||d.user.kind!=='safety'){return $('lerr').textContent=d.error||'소통실 계정이 아닙니다.'}token=d.token;me=d.user;sessionStorage.setItem('cv_safe_token',token);enter()}function logout(){token=null;me=null;sessionStorage.removeItem('cv_safe_token');$('app').classList.add('hidden');$('login').classList.remove('hidden')}function enter(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=`${me.org} · ${me.name}`;load();setInterval(load,20000)}
const hm=x=>new Date(x).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});function zname(id){return S?.zones?.find(z=>z.id===id)?.name||id}
async function load(){try{[S,R]=await Promise.all([api('/api/safety/state'),api('/api/on/returns')]);$('today').textContent=S.today;render()}catch(e){toast(e.message)}}function render(){const pending=S.hazards.filter(h=>h.status==='pending');$('voiceCount').textContent=pending.length;$('voiceList').innerHTML=pending.length?pending.slice(0,4).map(h=>`<div class="row" onclick="voiceDetail('${h.id}')"><div class="main"><b>${esc(h.carrier)} · ${hm(h.createdAt)}</b><span>${esc(h.transcript||'음성 변환 중…')}</span></div><span class="pill">확인</span></div>`).join(''):'<div class="empty">미처리 음성신고가 없습니다.</div>';$('callCount').textContent=S.calls.length;$('callList').innerHTML=S.calls.length?S.calls.slice(0,3).map(c=>`<div class="row" onclick="callDetail('${c.id}')"><div class="main"><b>${esc(c.carrier)} · ${hm(c.at)}</b><span>${esc(c.note||'통화 메모 없음')}</span></div><span>›</span></div>`).join(''):'<div class="empty">오늘 통화 기록이 없습니다.</div>';const q=R.summary;$('returnCount').textContent=`${q.reported}/${q.target}`;$('returnStats').innerHTML=`<div class="stat"><b>${q.reported}</b><span>보고</span></div><div class="stat"><b>${q.missing}</b><span>미보고</span></div><div class="stat"><b class="${q.body?'danger':''}">${q.body}</b><span>건강 이상</span></div><div class="stat"><b class="${q.equipment?'danger':''}">${q.equipment}</b><span>장비 이상</span></div>`;const issues=R.rows.filter(r=>r.report&&(r.report.bodyIssue||r.report.equipmentIssue));$('issueList').innerHTML=issues.length?issues.slice(0,3).map(r=>`<div class="row" onclick="returnDetail('${r.id}')"><div class="main"><b>${esc(r.name)} · ${esc(r.zoneName)}</b><span>${r.report.bodyIssue?'건강 이상 ':''}${r.report.equipmentIssue?'장비 이상':''}</span></div><span class="pill">조치 확인</span></div>`).join(''):'<div class="empty">오늘 이상 보고가 없습니다.</div>'}
function voiceDetail(id){const h=S.hazards.find(x=>x.id===id);if(!h)return;const d=h.draft||{};modal(`<h2>음성 위험신고</h2><div class="detailbox"><b>${esc(h.carrier)}</b> · ${hm(h.createdAt)}<br>${esc(h.transcript||'음성 변환 중…')}</div>${h.audioUrl?`<audio controls style="width:100%" src="${esc(h.audioUrl)}"></audio>`:'<div class="sub">녹음 파일 없음</div>'}<div class="field"><label>알림 문구</label><textarea id="vtext">${esc(d.text||h.transcript||'')}</textarea></div><div class="field"><label>단계</label><select id="vlevel"><option value="urgent">긴급</option><option value="caution" ${d.level!=='urgent'?'selected':''}>주의</option><option value="notice">전달말씀</option></select></div><div class="field"><label>대상 구역</label><div class="zones">${S.zones.map(z=>`<label><input type="checkbox" name="vz" value="${esc(z.id)}" ${(d.zones||[]).includes(z.id)?'checked':''}> ${esc(z.name)}</label>`).join('')}</div></div><div class="footer-actions"><button class="btn primary" onclick="dispatchVoice('${h.id}')">알림 전파</button><button class="btn" onclick="closeVoice('${h.id}')">전파 없이 처리</button></div>`)}async function dispatchVoice(id){const zones=[...document.querySelectorAll('input[name=vz]:checked')].map(x=>x.value);await api('/api/safety/hazards/'+id+'/dispatch',{method:'POST',body:JSON.stringify({text:$('vtext').value,level:$('vlevel').value,zones})});closeModal();toast('알림을 전파했습니다');load()}async function closeVoice(id){await api('/api/safety/hazards/'+id+'/close',{method:'POST',body:JSON.stringify({reason:'noalert'})});closeModal();toast('처리했습니다');load()}
function callDetail(id){const c=S.calls.find(x=>x.id===id);modal(`<h2>관제실 통화</h2><div class="detailbox"><b>${esc(c.carrier)}</b> · ${hm(c.at)}</div><div class="field"><label>통화 메모</label><textarea id="callnote">${esc(c.note||'')}</textarea></div><button class="btn primary" onclick="saveCall('${id}')">메모 저장</button>`)}async function saveCall(id){await api('/api/safety/calls/'+id+'/note',{method:'POST',body:JSON.stringify({note:$('callnote').value})});closeModal();load()}
function openCompose(){modal(`<h2>안전 알림 보내기</h2><div class="field"><label>단계</label><select id="alevel"><option value="urgent">긴급</option><option value="caution" selected>주의</option><option value="notice">전달말씀</option></select></div><div class="field"><label>내용</label><textarea id="atext" placeholder="알림 내용을 입력하세요"></textarea></div><div class="field"><label>대상</label><div class="zones"><label><input type="checkbox" id="allz" onchange="document.querySelectorAll('[name=az]').forEach(x=>x.checked=this.checked)"> 전체</label>${S.zones.map(z=>`<label><input type="checkbox" name="az" value="${esc(z.id)}"> ${esc(z.name)}</label>`).join('')}</div></div><button class="btn primary" onclick="sendAlert()">알림 보내기</button>`)}async function sendAlert(){const zones=[...document.querySelectorAll('[name=az]:checked')].map(x=>x.value);await api('/api/safety/alerts',{method:'POST',body:JSON.stringify({level:$('alevel').value,text:$('atext').value,zones:$('allz').checked?'all':zones})});closeModal();toast('알림을 보냈습니다');load()}
async function openHistory(type){H=H||await api('/api/safety/history');if(type==='voice'){const list=H.hazards.filter(h=>h.status!=='pending');modal(`<h2>처리한 음성신고</h2>${list.length?list.map(h=>`<div class="row" onclick="historyVoice('${h.id}')"><div class="main"><b>${esc(h.carrier)} · ${hm(h.createdAt)}</b><span>${esc(h.transcript||'')}</span></div><span class="pill">${esc(h.status)}</span></div>`).join(''):'<div class="empty">처리내역 없음</div>'}`)}if(type==='call')modal(`<h2>관제실 통화내역</h2>${H.calls.map(c=>`<div class="row"><div class="main"><b>${esc(c.carrier)} · ${new Date(c.at).toLocaleString('ko-KR')}</b><span>${esc(c.note||'메모 없음')}</span></div></div>`).join('')||'<div class="empty">내역 없음</div>'}`);if(type==='alert')modal(`<h2>보낸 안전 알림</h2>${H.alerts.map(a=>`<div class="row" onclick="alertDetail('${a.id}')"><div class="main"><b>${esc(a.text)}</b><span>${new Date(a.createdAt).toLocaleString('ko-KR')} · 대상 ${a.targets.length}명</span></div><span>›</span></div>`).join('')||'<div class="empty">내역 없음</div>'}`);if(type==='notice'){const d=await api('/api/on/notices');modal(`<h2>공지 이력</h2>${d.notices.map(n=>`<div class="detailbox"><b>${esc(n.title)}</b><br>${esc(n.body)}<br><span class="sub">${new Date(n.createdAt).toLocaleString('ko-KR')} · 확인 ${Object.keys(n.acks||{}).length}/${n.targets.length}</span></div>`).join('')||'<div class="empty">내역 없음</div>'}`)}}function historyVoice(id){const h=H.hazards.find(x=>x.id===id);modal(`<h2>처리 음성신고 상세</h2><div class="detailbox"><b>${esc(h.carrier)}</b> · ${new Date(h.createdAt).toLocaleString('ko-KR')}<br>${esc(h.transcript||'')}<br>처리: ${esc(h.handledBy||'-')} · ${esc(h.status)}</div>${h.audioUrl?`<audio controls style="width:100%" src="${esc(h.audioUrl)}"></audio>`:'<div class="sub">녹음 파일 없음</div>'}`)}function alertDetail(id){const a=H.alerts.find(x=>x.id===id);const names=a.targets.map(id=>S.roster.find(r=>r.id===id)?.name||id);modal(`<h2>안전 알림 상세</h2><div class="detailbox"><b>${esc(a.text)}</b><br>발송: ${new Date(a.createdAt).toLocaleString('ko-KR')}<br>대상: ${esc(names.join(', '))}<br>확인: ${Object.keys(a.acks||{}).length}/${a.targets.length}</div>`)}
function openReturns(){const rows=R.rows;modal(`<h2>업무종료 전체 상세</h2><p class="sub">정상 보고도 포함해 당일 전체 기록을 조회합니다.</p>${rows.map(r=>`<div class="row" ${r.report?`onclick="returnDetail('${r.id}')"`:''}><div class="main"><b>${esc(r.name)} · ${esc(r.zoneName)}</b><span>${!r.report?'미보고':(r.report.bodyIssue||r.report.equipmentIssue?`${r.report.bodyIssue?'건강 이상 ':''}${r.report.equipmentIssue?'장비 이상':''}`:'건강·장비 이상 없음')}</span></div><span class="${!r.report?'danger':(!r.report.bodyIssue&&!r.report.equipmentIssue?'ok':'danger')}">${!r.report?'미보고':'›'}</span></div>`).join('')||'<div class="empty">내역 없음</div>'}`)}function returnDetail(id){const r=R.rows.find(x=>x.id===id),x=r.report;if(!x)return;modal(`<h2>${esc(r.name)} 업무종료 보고</h2><div class="detailbox"><b>건강 상태</b> · ${x.bodyIssue?'이상 있음 · '+esc(x.bodyDetail):'이상 없음'}<br><b>장비 상태</b> · ${x.equipmentIssue?'이상 있음 · '+esc(x.equipmentDetail):'이상 없음'}<br>보고 ${new Date(x.at).toLocaleString('ko-KR')}</div><div class="field"><label>조치사항</label><textarea id="raction">${esc(x.action?.detail||'')}</textarea></div><div class="field"><label>상태</label><select id="rstatus"><option value="pending">대기</option><option value="in_progress" ${x.action?.status==='in_progress'?'selected':''}>조치중</option><option value="done" ${x.action?.status==='done'?'selected':''}>완료</option></select></div><button class="btn primary" onclick="saveReturnAction('${id}')">조치 저장</button>`)}async function saveReturnAction(id){await api('/api/on/returns/'+id+'/action',{method:'POST',body:JSON.stringify({date:R.date,detail:$('raction').value,status:$('rstatus').value,owner:me.name})});closeModal();toast('조치사항을 저장했습니다');load()}
async function openNotice(){C=C||await api('/api/safety/config');modal(`<h2>공지사항 작성</h2><div class="field"><label>제목</label><input id="ntitle"></div><div class="field"><label>내용</label><textarea id="nbody"></textarea></div><div class="field"><label>수신 대상</label><div class="zones">${C.roster.map(r=>`<label><input type="checkbox" name="nt" value="${esc(r.id)}" checked> ${esc(r.name)}</label>`).join('')}</div></div><button class="btn primary" onclick="sendNotice()">공지 발송</button>`)}async function sendNotice(){const targets=[...document.querySelectorAll('[name=nt]:checked')].map(x=>x.value);await api('/api/on/notices',{method:'POST',body:JSON.stringify({title:$('ntitle').value,body:$('nbody').value,targets})});closeModal();toast('공지를 발송했습니다')}
async function openConfig(){C=await api('/api/safety/config');modal(`<h2>구역 · 집배원 관리</h2><h3>집배 구역</h3><div id="zonesCfg">${C.zones.map(z=>`<div class="cfgrow"><input value="${esc(z.name)}" id="zn_${z.id}"><input value="${esc(z.area||'')}" id="za_${z.id}"><span>${esc(z.id)}</span><span><button class="btn" onclick="saveZone('${z.id}')">수정</button> <button class="btn" onclick="delZone('${z.id}')">삭제</button></span></div>`).join('')}</div><div class="cfgrow"><input id="newZName" placeholder="새 구역명"><input id="newZArea" placeholder="담당 지역"><input id="newZId" placeholder="ID(선택)"><button class="btn primary" onclick="addZone()">추가</button></div><h3 style="margin-top:24px">집배원</h3>${C.roster.map(r=>`<div class="cfgrow"><input id="rn_${r.id}" value="${esc(r.name)}"><select id="rz_${r.id}">${C.zones.map(z=>`<option value="${z.id}" ${z.id===r.zone?'selected':''}>${esc(z.name)}</option>`).join('')}</select><input id="rp_${r.id}" value="${esc(r.phone||'')}"><span><button class="btn" onclick="saveRoster('${r.id}')">수정</button> <button class="btn" onclick="delRoster('${r.id}')">삭제</button></span></div>`).join('')}<div class="cfgrow"><input id="newRName" placeholder="이름"><select id="newRZone">${C.zones.map(z=>`<option value="${z.id}">${esc(z.name)}</option>`).join('')}</select><input id="newRId" placeholder="로그인 계정 ID"><button class="btn primary" onclick="addRoster()">추가</button></div><p class="sub">새 집배원은 기존 로그인 계정 ID와 연결해야 앱 안전기능을 사용할 수 있습니다.</p>`)}async function saveZone(id){await api('/api/safety/config/zones/'+id,{method:'PATCH',body:JSON.stringify({name:$('zn_'+id).value,area:$('za_'+id).value})});toast('수정했습니다');openConfig();load()}async function delZone(id){if(!confirm('구역을 삭제할까요?'))return;await api('/api/safety/config/zones/'+id,{method:'DELETE'});openConfig();load()}async function addZone(){await api('/api/safety/config/zones',{method:'POST',body:JSON.stringify({id:$('newZId').value,name:$('newZName').value,area:$('newZArea').value})});openConfig();load()}async function saveRoster(id){await api('/api/safety/config/roster/'+id,{method:'PATCH',body:JSON.stringify({name:$('rn_'+id).value,zone:$('rz_'+id).value,phone:$('rp_'+id).value})});toast('수정했습니다');openConfig();load()}async function delRoster(id){if(!confirm('집배원을 명부에서 삭제할까요?'))return;await api('/api/safety/config/roster/'+id,{method:'DELETE'});openConfig();load()}async function addRoster(){await api('/api/safety/config/roster',{method:'POST',body:JSON.stringify({id:$('newRId').value,name:$('newRName').value,zone:$('newRZone').value})});openConfig();load()}
boot();

async function openEvidence(){
 const end=new Date().toISOString().slice(0,10), d=new Date();d.setDate(d.getDate()-30);const start=d.toISOString().slice(0,10);
 modal(`<h2>통계·증빙 조회</h2><div class="field"><label>조회 시작일</label><input type="date" id="evStart" value="${start}"></div><div class="field"><label>조회 종료일</label><input type="date" id="evEnd" value="${end}"></div><button class="btn primary" onclick="runEvidence()">조회</button><div id="evResult"></div>`)
}
async function runEvidence(){
 const start=$('evStart').value,end=$('evEnd').value;if(!start||!end)return;
 const d=await api(`/api/safety/evidence?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`),q=d.summary;
 $('evResult').innerHTML=`<div class="return-stats" style="margin-top:14px"><div class="stat"><b>${q.voice}</b><span>음성 위험신고</span></div><div class="stat"><b>${q.calls}</b><span>관제실 통화</span></div><div class="stat"><b>${q.alerts}</b><span>안전 알림</span></div><div class="stat"><b>${q.returnReports}</b><span>업무종료 보고</span></div><div class="stat"><b>${q.normalReturns}</b><span>이상 없음</span></div><div class="stat"><b>${q.bodyIssues}</b><span>건강 이상</span></div><div class="stat"><b>${q.equipmentIssues}</b><span>장비 이상</span></div></div><div class="detailbox"><b>${esc(d.start)} ~ ${esc(d.end)}</b><br>모든 원자료는 서버에 보존되며, 각 기존 처리내역/통화내역/업무종료 상세에서 개별 기록을 확인할 수 있습니다.</div>`;
}
</script></body></html>
