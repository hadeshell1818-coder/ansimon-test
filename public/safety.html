<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>집배원 안전관제 · 장흥우체국</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --ink:#0E1216; --ink-2:#48525C; --line:#DDE2E7; --panel:#fff; --bg:#EEF1F4; --console:#10141A;
    --post:#E4002B; --urgent:#C8102E; --caution:#D98200; --notice:#0E5E66; --ok:#0B8A5B; --none:#7C8794;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Pretendard',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
  button,input,textarea,select{font-family:inherit;}
  button{cursor:pointer;}
  .hidden{display:none !important;}

  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 90% at 50% -10%,#232A33,#12161C 60%,#0B0E12);}
  .lg{width:100%;max-width:400px;color:#fff;}
  .lg h1{font-size:22px;margin:10px 0 4px;} .lg p{color:#AEB6BF;font-size:13px;margin:0 0 20px;}
  .lg input{width:100%;border:1px solid #2E3742;background:#141A21;color:#fff;border-radius:12px;padding:14px;font-size:15px;margin-bottom:10px;}
  .lg button{width:100%;border:none;background:var(--post);color:#fff;font-size:15px;font-weight:800;padding:15px;border-radius:12px;}
  .lg .err{color:#FF7B7B;font-size:12px;font-weight:700;min-height:16px;margin-bottom:6px;}
  .badge{background:var(--post);color:#fff;font-weight:800;font-size:11px;padding:3px 8px;border-radius:6px;}

  .top{background:var(--console);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;position:sticky;top:0;z-index:40;transition:background .2s;}
  .top.flash{background:var(--urgent);}
  .top .sys{font-weight:800;font-size:15px;} .top .sys small{display:block;font-size:11px;color:#8A94A0;font-weight:600;}
  .top .sp{flex:1;}
  .tbtn{border:1px solid #333B45;background:transparent;color:#C6CDD4;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;}
  .tbtn.warn{border-color:var(--caution);color:#FFD27A;}

  .grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;padding:18px 20px 40px;max-width:1400px;margin:0 auto;}
  @media (max-width:980px){.grid{grid-template-columns:1fr;padding:14px;}}
  .col{display:flex;flex-direction:column;gap:18px;min-width:0;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .ph{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:15px;font-weight:800;}
  .ph .cnt{background:var(--urgent);color:#fff;border-radius:999px;font-size:12px;padding:1px 8px;}
  .ph .sub{margin-left:auto;font-size:12px;color:var(--ink-2);font-weight:600;}
  .empty{border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--ink-2);font-size:13px;}

  /* 음성 신고 카드 */
  .hz{border:1px solid var(--line);border-left:5px solid var(--urgent);border-radius:12px;padding:14px;margin-bottom:12px;}
  .hz.new{animation:newin 1.2s ease-out 2;}
  @keyframes newin{0%{background:#FFE3E7}100%{background:#fff}}
  @media (prefers-reduced-motion:reduce){.hz.new{animation:none}}
  .hz-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--ink-2);font-weight:700;}
  .hz-meta b{color:var(--ink);font-size:14px;}
  .hz-meta a{color:var(--notice);}
  .hz-body{display:flex;gap:12px;margin-top:10px;}
  .hz-body img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;flex:0 0 auto;}
  .hz-txt{flex:1;min-width:0;}
  .quote{background:#F4F6F8;border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.55;font-weight:600;}
  .src{font-size:11px;color:var(--ink-2);font-weight:700;margin:4px 0 6px;}
  audio{width:100%;height:36px;margin-top:8px;}
  .dup{margin-top:8px;background:#FFF6E0;border:1px solid #F0D9A0;border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:700;color:#5A4200;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .dup button{border:1px solid #E0B85A;background:#fff;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:800;color:#5A4200;}
  .draft{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;}
  .draft .lab{font-size:11.5px;font-weight:800;color:var(--ink-2);margin:0 0 6px;display:flex;gap:6px;align-items:center;}
  .ai{background:#E8F1FF;color:#1D4ED8;border-radius:5px;padding:1px 6px;font-size:10.5px;}
  textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;font-size:14.5px;line-height:1.5;resize:vertical;min-height:64px;}
  textarea:focus,input:focus{outline:none;border-color:var(--notice);}
  .seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg button{border:none;background:#fff;padding:8px 14px;font-size:13px;font-weight:800;color:var(--ink-2);}
  .seg button+button{border-left:1.5px solid var(--line);}
  .seg button.on.urgent{background:var(--urgent);color:#fff;} .seg button.on.caution{background:var(--caution);color:#fff;} .seg button.on.notice{background:var(--notice);color:#fff;}
  .zones{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .zc{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--ink-2);}
  .zc.on{background:var(--console);border-color:var(--console);color:#fff;}
  .zc small{opacity:.7;font-weight:600;}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:800;color:var(--ink);}
  .btn.primary{background:var(--console);border-color:var(--console);color:#fff;flex:1;}
  .btn.primary.urgent{background:var(--urgent);border-color:var(--urgent);}
  .btn:disabled{opacity:.5;cursor:default;}
  .hint{font-size:11.5px;color:var(--ink-2);margin-top:6px;}

  .done-list{display:flex;flex-direction:column;gap:6px;}
  .dl{display:flex;gap:10px;align-items:center;font-size:13px;background:#F7F9FA;border-radius:9px;padding:8px 10px;}
  .dl .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pill{font-size:11px;font-weight:800;color:#fff;border-radius:999px;padding:2px 8px;white-space:nowrap;}

  .call{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
  .call .ico{grid-row:span 2;width:36px;height:36px;border-radius:10px;background:#E6F2F3;color:var(--notice);display:flex;align-items:center;justify-content:center;}
  .call .ico svg{width:20px;height:20px;}
  .call .cm{font-size:13px;font-weight:700;color:var(--ink-2);} .call .cm b{color:var(--ink);font-size:14px;}
  .call .row{display:flex;gap:6px;grid-column:2;margin-top:4px;}
  .call input{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13.5px;min-width:0;}

  .al{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
  .al .m{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-2);font-weight:700;}
  .al .tx{font-size:14px;font-weight:700;margin:6px 0 0;line-height:1.5;}
  .ackbar{margin-top:10px;}
  .ackbar .bar{height:8px;background:#EEF1F4;border-radius:999px;overflow:hidden;}
  .ackbar .bar i{display:block;height:100%;background:var(--ok);}
  .ackbar .lb{font-size:12px;font-weight:800;margin-top:5px;display:flex;justify-content:space-between;}
  .unack{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .unack button{border:1.5px solid var(--urgent);background:#FFF1F3;color:var(--urgent);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:800;}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
  .st{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 8px;text-align:center;}
  .st.on{border-color:var(--console);box-shadow:inset 0 0 0 1px var(--console);}
  .st .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;}
  .st .l{font-size:12px;font-weight:700;color:var(--ink-2);margin-top:3px;}
  .srow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #EEF1F4;cursor:pointer;}
  .srow:hover{background:#F7F9FA;}
  .srow .nm{font-weight:800;} .srow .zn{font-size:12px;color:var(--ink-2);font-weight:600;}
  .srow .memo{flex:1;font-size:12.5px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .srow .src{margin:0;white-space:nowrap;}

  .modal{position:fixed;inset:0;background:rgba(10,14,18,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal.on{display:flex;}
  .card{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:88vh;overflow:auto;}
  .card h3{margin:0 0 4px;font-size:18px;} .card .z{color:var(--ink-2);font-weight:700;font-size:13px;}
  .phone{font-size:26px;font-weight:800;letter-spacing:.5px;margin:14px 0 4px;font-variant-numeric:tabular-nums;}
  .kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;font-size:13.5px;margin:12px 0;}
  .kv dt{color:var(--ink-2);font-weight:700;} .kv dd{margin:0;font-weight:600;}
  .card input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;font-size:14px;margin-top:6px;}
  .hist{font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.6;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--console);color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.25s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="lg">
    <span class="badge">우체국</span>
    <h1>집배원 안전관제</h1>
    <p>총괄국 소통팀장 계정으로 로그인하세요.</p>
    <input id="lid" placeholder="아이디" autocapitalize="off" onkeydown="if(event.key==='Enter')doLogin()">
    <input id="lpw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="err" id="lerr"></div>
    <button onclick="doLogin()">로그인</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="top" id="top">
    <span class="badge">우체국</span>
    <div class="sys">집배원 안전관제<small id="who">—</small></div>
    <div class="sp"></div>
    <button class="tbtn warn" id="soundBtn" onclick="enableSound()">🔔 경보음 켜기</button>
    <button class="tbtn" onclick="logout()">로그아웃</button>
  </div>
  <div class="grid">
<section class="panel" id="on-return-panel" style="grid-column:1/-1"><h3>🏠 귀국보고 · 신체/장비 이상 및 조치</h3><div id="on-return-content">로그인 후 귀국현황을 표시합니다.</div></section>
<section class="panel" id="on-notice-panel" style="grid-column:1/-1"><h3>📌 공지사항</h3><div id="on-notice-content">로그인 후 공지사항을 표시합니다.</div></section>
    <div class="col">
      <section class="panel">
        <div class="ph">🎙 음성 위험신고 <span class="cnt hidden" id="hzCnt"></span><span class="sub">확인하면 해당 구역에 바로 전파됩니다</span></div>
        <div id="hzList"></div>
      </section>
      <section class="panel">
        <div class="ph">📞 오늘 관제실 통화 기록<span class="sub">집배원이 PDA에서 전화 버튼을 누르면 자동 기록</span></div>
        <div id="callList"></div>
      </section>
      <section class="panel">
        <div class="ph">처리한 음성 신고<span class="sub">오늘</span></div>
        <div id="doneList"></div>
      </section>
    </div>
    <div class="col">
      <section class="panel" id="composePanel">
        <div class="ph">📣 안전 알림 보내기</div>
        <div class="seg" id="cLevel">
          <button class="urgent" data-l="urgent" onclick="setCLevel('urgent')">긴급</button>
          <button class="caution on" data-l="caution" onclick="setCLevel('caution')">주의</button>
          <button class="notice" data-l="notice" onclick="setCLevel('notice')">전달말씀</button>
        </div>
        <div class="hint" id="cHint"></div>
        <textarea id="cText" style="margin-top:10px" maxlength="200" placeholder="예) 오후 2시 이후 폭염특보. 30분마다 그늘에서 쉬어 주세요."></textarea>
        <div class="zones" id="cZones"></div>
        <div class="acts"><button class="btn primary" id="cSend" onclick="sendCompose()">알림 보내기</button></div>
      </section>
      <section class="panel">
        <div class="ph">오늘 보낸 알림<span class="sub">수신확인은 긴급만</span></div>
        <div id="alertList"></div>
      </section>
      <section class="panel">
        <div class="ph">🦺 업무종료 이상유무<span class="sub" id="shiftDate"></span></div>
        <div class="stats" id="shiftStats"></div>
        <div id="shiftList"></div>
      </section>
    </div>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=iso=>{const d=new Date(iso);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
const LV={urgent:['긴급','var(--urgent)'],caution:['주의','var(--caution)'],notice:['전달말씀','var(--notice)']};
const SH={ok:['이상없음','var(--ok)'],pain:['경미한 통증','var(--caution)'],injury:['부상 있음','var(--urgent)'],none:['미보고','var(--none)']};
const STT={openai:'AI 음성 변환',device:'PDA 음성인식',demo:'시연용 예시',none:'변환 없음 · 녹음을 들어주세요',pending:'음성 변환 중…'};
let token=sessionStorage.getItem('cv_safe_token')||null, me=null, S=null, ws=null, poll=null;
let edits={}, seen=null, actx=null, shiftFilter=null, cLevel='caution', cZones='all', cFromCall=null, renderDeferred=false;

async function api(path,opts={}){
  opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(token) opts.headers.Authorization='Bearer '+token;
  const r=await fetch(path,opts);
  if(r.status===401){ logout(); throw new Error('다시 로그인하세요'); }
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||'요청 실패');
  return d;
}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}

/* ---------- 로그인 ---------- */
async function boot(){
  if(token){ try{ const d=await api('/api/me'); if(d.user.kind==='safety'){ me=d.user; return enter(); } if(d.user.kind==='safety_mgr'){ sessionStorage.setItem('cv_risk_token',token); location.href='/risk.html'; return; } }catch(e){} }
  $('login').classList.remove('hidden');
}
async function doLogin(){
  enableSound(true);
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('lid').value.trim(),pw:$('lpw').value})});
    const d=await r.json();
    if(!r.ok){ $('lerr').textContent=d.error||'로그인 실패'; return; }
    if(d.user.kind==='safety_mgr'){ sessionStorage.setItem('cv_risk_token',d.token); location.href='/risk.html'; return; }
    if(d.user.kind!=='safety'){ $('lerr').textContent='안전관제(소통팀장) 계정이 아닙니다.'; return; }
    token=d.token; me=d.user; sessionStorage.setItem('cv_safe_token',token); enter();
  }catch(e){ $('lerr').textContent='서버 연결 실패'; }
}
function logout(){
  if(token) fetch('/api/logout',{method:'POST',headers:{Authorization:'Bearer '+token}}).catch(()=>{});
  token=null; me=null; sessionStorage.removeItem('cv_safe_token');
  if(ws){ ws.onclose=null; try{ws.close();}catch(e){} } clearInterval(poll);
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
}
function enter(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('who').textContent=`${me.org} · ${me.name}`;
  const proto=location.protocol==='https:'?'wss':'ws';
  const open=()=>{ if(!token) return; ws=new WebSocket(`${proto}://${location.host}?token=${token}`);
    ws.onmessage=e=>{ try{ if(JSON.parse(e.data).type==='safety') load(); }catch(_){} };
    ws.onclose=()=>{ if(token) setTimeout(open,3000); }; };
  open(); poll=setInterval(load,60000); setCLevel('caution'); load();
}

/* ---------- 경보(소리·제목 깜빡임·데스크톱 알림) ---------- */
function enableSound(silent){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){}
  if('Notification' in window && Notification.permission==='default') Notification.requestPermission().catch(()=>{});
  $('soundBtn').textContent='🔔 경보음 켜짐'; $('soundBtn').classList.remove('warn');
  if(!silent) beep(2);
}
function beep(n){ if(!actx) return; try{ const t0=actx.currentTime;
  for(let i=0;i<n;i++){ const o=actx.createOscillator(),g=actx.createGain(); o.type='square'; o.frequency.value=i%2?740:988; const st=t0+i*0.22;
    g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.2,st+0.02); g.gain.exponentialRampToValueAtTime(0.0001,st+0.17);
    o.connect(g).connect(actx.destination); o.start(st); o.stop(st+0.19);} }catch(e){} }
let flashT=null;
function alarm(title,body){
  beep(6);
  const top=$('top'); let k=0; clearInterval(flashT);
  flashT=setInterval(()=>{ top.classList.toggle('flash'); if(++k>=10){ clearInterval(flashT); top.classList.remove('flash'); } },400);
  if(document.hidden && 'Notification' in window && Notification.permission==='granted'){ try{ new Notification(title,{body}); }catch(e){} }
}

/* ---------- 데이터 ---------- */
async function load(){
  try{ S=await api('/api/safety/state'); }catch(e){ return; }
  if(S.role!=='control') return;
  // 새 음성신고·통화 기록 감지 → 경보
  const ids=[...S.hazards.filter(h=>h.status==='pending').map(h=>h.id), ...S.calls.map(c=>c.id)];
  if(seen===null) seen=new Set(ids);
  else {
    const fresh=ids.filter(i=>!seen.has(i)); fresh.forEach(i=>seen.add(i));
    if(fresh.length){
      const h=S.hazards.find(x=>x.id===fresh[0]), c=S.calls.find(x=>x.id===fresh[0]);
      alarm(h?'새 음성 위험신고':'집배원 전화 연결', h?`${h.carrier} · ${h.transcript||'음성 신고'}`:`${c.carrier}`);
      window._freshIds=new Set(fresh);
    }
  }
  const pend=S.hazards.filter(h=>h.status==='pending').length;
  document.title=(pend?`(${pend}) `:'')+'집배원 안전관제 · 장흥우체국';
  if(!$('cZones').dataset.ready){ renderComposeZones(); $('cZones').dataset.ready='1'; }
  const active=document.activeElement;
  if(active && $('hzList').contains(active) && /TEXTAREA|INPUT/.test(active.tagName)) renderDeferred=true; else renderHazards();
  if(!(active && $('callList').contains(active))) renderCalls();
  renderDone(); renderAlerts(); renderShift();
}
document.addEventListener('focusout',()=>setTimeout(()=>{ if(renderDeferred && !$('hzList').contains(document.activeElement)){ renderDeferred=false; renderHazards(); } },0));
const zoneName=id=>S.zones.find(z=>z.id===id)?.name||id;
const mapLink=(lat,lng)=>lat!=null?`<a href="https://map.kakao.com/link/map/신고위치,${lat},${lng}" target="_blank" rel="noopener">📍 지도</a>`:'<span>위치 없음</span>';

/* ---------- 음성 위험신고 ---------- */
function editOf(h){
  if(!edits[h.id]) edits[h.id]=h.draft?{text:h.draft.text,level:h.draft.level,zones:[...h.draft.zones],mode:h.draft.mode}:null;
  return edits[h.id];
}
function renderHazards(){
  const list=S.hazards.filter(h=>h.status==='pending');
  $('hzCnt').textContent=list.length; $('hzCnt').classList.toggle('hidden',!list.length);
  if(!list.length){ $('hzList').innerHTML='<div class="empty">확인할 음성 신고가 없습니다.</div>'; return; }
  const fresh=window._freshIds||new Set(); window._freshIds=null;
  $('hzList').innerHTML=list.map(h=>{
    const e=editOf(h);
    const draft = e ? `
      <div class="draft">
        <div class="lab">알림 초안 <span class="ai">${e.mode==='openai'?'AI 작성':'자동 작성'}</span> — 고칠 곳만 고치고 확인을 누르세요</div>
        <div class="seg">${['urgent','caution'].map(l=>`<button class="${l} ${e.level===l?'on':''}" onclick="hzLevel('${h.id}','${l}')">${LV[l][0]}</button>`).join('')}</div>
        <textarea style="margin-top:8px" oninput="edits['${h.id}'].text=this.value">${esc(e.text)}</textarea>
        <div class="zones">${S.zones.map(z=>`<button class="zc ${e.zones.includes(z.id)?'on':''}" onclick="hzZone('${h.id}','${z.id}')">${esc(z.name)} <small>${esc(z.area)}</small></button>`).join('')}</div>
        <div class="acts">
          <button class="btn primary ${e.level==='urgent'?'urgent':''}" onclick="hzDispatch('${h.id}')">확인 · ${e.zones.length}개 구역에 ${LV[e.level][0]} 전파</button>
          <button class="btn" onclick="hzClose('${h.id}')">전파 없이 종결</button>
          <button class="btn" onclick="hzToRisk('${h.id}')">위험성평가로 이관</button>
        </div>
        ${e.level==='urgent'?'<div class="hint">긴급은 집배원이 확인을 누를 때까지 PDA 화면에 고정되고 수신확인을 집계합니다.</div>':''}
      </div>` : `<div class="draft"><div class="lab">AI가 알림 초안을 만드는 중…</div></div>`;
    const dups=(h.dups||[]).length?`<div class="dup">⚠️ 비슷한 신고: ${h.dups.map(d=>`${hm(d.createdAt)} ${esc(d.carrier)} <button onclick="hzClose('${h.id}','${d.id}')">${d.id}에 병합</button>`).join(' ')}</div>`:'';
    return `<article class="hz ${fresh.has(h.id)?'new':''}">
      <div class="hz-meta"><b>${esc(h.carrier)}</b><span>${hm(h.createdAt)}</span>${mapLink(h.lat,h.lng)}<span>${h.id}</span></div>
      <div class="hz-body">
        ${h.photoUrl?`<img src="${h.photoUrl}" alt="현장 사진" onclick="window.open(this.src,'_blank')">`:''}
        <div class="hz-txt">
          <div class="src">${STT[h.sttMode]||''}</div>
          <div class="quote">${h.transcript?esc(h.transcript):'<span style="color:var(--ink-2)">변환된 글이 없습니다</span>'}</div>
          ${h.audioUrl?`<audio controls preload="none" src="${h.audioUrl}"></audio>`:''}
        </div>
      </div>${dups}${draft}</article>`;
  }).join('');
}
function hzLevel(id,l){ edits[id].level=l; renderHazards(); }
function hzZone(id,z){ const e=edits[id]; e.zones=e.zones.includes(z)?e.zones.filter(x=>x!==z):[...e.zones,z]; renderHazards(); }
async function hzDispatch(id){
  const e=edits[id]; if(!e.text.trim()) return toast('알림 내용을 입력하세요');
  if(!e.zones.length) return toast('대상 구역을 선택하세요');
  try{ await api(`/api/safety/hazards/${id}/dispatch`,{method:'POST',body:JSON.stringify({text:e.text,level:e.level,zones:e.zones})});
    delete edits[id]; toast('전파했습니다'); load(); }catch(err){ toast(err.message); }
}
async function hzToRisk(id){
  const note=prompt('위험성평가로 넘길 내용을 확인·수정하세요','구조적 위험으로 판단');
  if(note===null) return;
  try{ await api('/api/safety/hazards/'+id+'/to-risk',{method:'POST',body:JSON.stringify({note})});
    delete edits[id]; toast('안전보건담당자에게 이관했습니다'); load(); }catch(e){ toast(e.message); }
}
async function hzClose(id,dupOf){
  if(!dupOf && !confirm('알림을 보내지 않고 종결할까요?')) return;
  try{ await api(`/api/safety/hazards/${id}/close`,{method:'POST',body:JSON.stringify(dupOf?{dupOf}:{reason:'noaction'})});
    delete edits[id]; toast(dupOf?'병합했습니다':'종결했습니다'); load(); }catch(err){ toast(err.message); }
}
function renderDone(){
  const list=S.hazards.filter(h=>h.status!=='pending');
  $('doneList').innerHTML=list.length?`<div class="done-list">${list.map(h=>`<div class="dl"><span>${hm(h.createdAt)}</span><span>${esc(h.carrier)}</span><span class="t">${esc(h.transcript||'')}</span>
    <span class="pill" style="background:${h.status==='dispatched'?'var(--ok)':'var(--none)'}">${h.status==='dispatched'?'전파됨':esc(h.closeReason||'종결')}</span></div>`).join('')}</div>`
    :'<div class="empty">아직 없습니다.</div>';
}

/* ---------- 통화 기록 ---------- */
function renderCalls(){
  const list=S.calls;
  $('callList').innerHTML=list.length?list.map(c=>`<div class="call">
      <div class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1Z"/></svg></div>
      <div class="cm"><b>${esc(c.carrier)}</b> · ${hm(c.at)} · ${mapLink(c.lat,c.lng)} ${c.alertId?'<span class="pill" style="background:var(--ok)">알림 전파됨</span>':''}</div>
      <div class="row"><input id="cn-${c.id}" value="${esc(c.note)}" placeholder="통화 내용 한 줄 (예: 관산 방촌 다리 앞 결빙)">
        <button class="btn" onclick="saveNote('${c.id}')">저장</button>
        <button class="btn" onclick="callToAlert('${c.id}')">알림 작성</button></div>
    </div>`).join(''):'<div class="empty">오늘 통화 기록이 없습니다.</div>';
}
async function saveNote(id){
  try{ await api(`/api/safety/calls/${id}/note`,{method:'POST',body:JSON.stringify({note:$('cn-'+id).value})}); toast('저장했습니다'); }catch(e){ toast(e.message); }
}
async function callToAlert(id){
  const note=$('cn-'+id).value.trim(); if(!note) return toast('통화 내용을 한 줄 적어주세요');
  try{
    await api(`/api/safety/calls/${id}/note`,{method:'POST',body:JSON.stringify({note})});
    const {draft}=await api(`/api/safety/calls/${id}/draft`,{method:'POST',body:JSON.stringify({note})});
    setCLevel(draft.level); $('cText').value=draft.text; cZones=[...draft.zones]; cFromCall=id; renderComposeZones();
    $('composePanel').scrollIntoView({behavior:'smooth',block:'start'}); $('cText').focus();
    toast('알림 초안을 채웠습니다. 확인 후 보내세요');
  }catch(e){ toast(e.message); }
}

/* ---------- 알림 보내기 ---------- */
function setCLevel(l){
  cLevel=l; document.querySelectorAll('#cLevel button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  $('cHint').textContent = l==='urgent' ? '긴 진동과 경고음, 음성 안내. 집배원이 확인을 누를 때까지 화면에 고정되고 수신확인을 집계합니다.'
    : '진동 후 잠시 표시되고 상단에 흐르는 글자로 남습니다. 수신확인은 받지 않습니다.';
  $('cSend').classList.toggle('urgent',l==='urgent');
}
function renderComposeZones(){
  const all=cZones==='all';
  $('cZones').innerHTML=`<button class="zc ${all?'on':''}" onclick="cZone('all')">전체</button>`+
    S.zones.map(z=>`<button class="zc ${!all&&cZones.includes(z.id)?'on':''}" onclick="cZone('${z.id}')">${esc(z.name)}</button>`).join('');
}
function cZone(z){
  if(z==='all') cZones='all';
  else { const cur=cZones==='all'?[]:cZones; cZones=cur.includes(z)?cur.filter(x=>x!==z):[...cur,z]; if(!cZones.length) cZones='all'; }
  renderComposeZones();
}
async function sendCompose(){
  const text=$('cText').value.trim(); if(!text) return toast('알림 내용을 입력하세요');
  const n=cZones==='all'?S.roster.length:S.roster.filter(r=>cZones.includes(r.zone)).length;
  if(!confirm(`${LV[cLevel][0]} 알림을 집배원 ${n}명에게 보낼까요?`)) return;
  $('cSend').disabled=true;
  try{ await api('/api/safety/alerts',{method:'POST',body:JSON.stringify({level:cLevel,text,zones:cZones,fromCall:cFromCall})});
    $('cText').value=''; cZones='all'; cFromCall=null; renderComposeZones(); toast('보냈습니다'); load(); }
  catch(e){ toast(e.message); } finally{ $('cSend').disabled=false; }
}
function renderAlerts(){
  const list=S.alerts;
  $('alertList').innerHTML=list.length?list.map(a=>{
    const tgt=a.zones==='all'?'전체':a.zones.map(zoneName).join(', ');
    let ack='';
    if(a.level==='urgent'){
      const acked=a.targets.filter(t=>a.acks&&a.acks[t]); const un=a.targets.filter(t=>!(a.acks&&a.acks[t]));
      const pct=a.targets.length?Math.round(acked.length/a.targets.length*100):0;
      ack=`<div class="ackbar"><div class="bar"><i style="width:${pct}%"></i></div>
        <div class="lb"><span>수신확인 ${acked.length} / ${a.targets.length}명</span><span style="color:${un.length?'var(--urgent)':'var(--ok)'}">${un.length?`미확인 ${un.length}명`:'모두 확인'}</span></div>
        ${un.length?`<div class="unack">${un.map(id=>{const r=S.roster.find(x=>x.id===id);return `<button onclick="personModal('${id}','${a.id}')">${esc(r?.name||id)} · ${esc(zoneName(r?.zone))}</button>`;}).join('')}</div>`:''}</div>`;
    }
    return `<div class="al" style="border-left-color:${LV[a.level][1]}">
      <div class="m"><span class="pill" style="background:${LV[a.level][1]}">${LV[a.level][0]}</span>${hm(a.createdAt)} · 대상 ${esc(tgt)} (${a.targets.length}명)${a.fromHazard?' · 음성신고 전파':a.fromCall?' · 통화 후 전파':''}</div>
      <div class="tx">${esc(a.text)}</div>${ack}</div>`;
  }).join(''):'<div class="empty">오늘 보낸 알림이 없습니다.</div>';
}

/* ---------- 업무종료 이상유무 ---------- */
function renderShift(){
  const rows=S.shifts, c={all:rows.length,ok:0,issue:0,none:0};
  rows.forEach(r=>{ if(r.status==='ok') c.ok++; else if(r.status==='none') c.none++; else c.issue++; });
  $('shiftDate').textContent=S.today;
  const st=(k,l,col)=>`<button class="st ${shiftFilter===k||(!shiftFilter&&k==='all')?'on':''}" onclick="setShiftFilter('${k}')"><div class="n" style="color:${col}">${c[k]}</div><div class="l">${l}</div></button>`;
  $('shiftStats').innerHTML=st('all','총원','var(--ink)')+st('ok','이상없음','var(--ok)')+st('issue','이상','var(--urgent)')+st('none','미보고','var(--none)');
  const f=rows.filter(r=>!shiftFilter||shiftFilter==='all'||(shiftFilter==='ok'&&r.status==='ok')||(shiftFilter==='none'&&r.status==='none')||(shiftFilter==='issue'&&(r.status==='pain'||r.status==='injury')))
    .sort((a,b)=>({injury:0,pain:1,none:2,ok:3}[a.status])-({injury:0,pain:1,none:2,ok:3}[b.status]));
  $('shiftList').innerHTML=f.length?f.map(r=>`<div class="srow" onclick="shiftModal('${r.id}')">
      <span class="pill" style="background:${SH[r.status][1]}">${SH[r.status][0]}</span>
      <span><span class="nm">${esc(r.name)}</span> <span class="zn">${esc(r.zoneName)}</span></span>
      <span class="memo">${esc(r.memo)}</span>
      <span class="src">${r.source==='control'?`관제 확인 ${hm(r.at)}`:r.at?`본인 ${hm(r.at)}`:''}</span></div>`).join('')
    :'<div class="empty">해당 인원이 없습니다.</div>';
}
function setShiftFilter(k){ shiftFilter=k==='all'?null:k; renderShift(); }
function shiftModal(id){
  const r=S.shifts.find(x=>x.id===id);
  const hist=(r.history||[]).map(h=>`${hm(h.at)} ${SH[h.status][0]} (${h.source==='control'?'관제 '+(h.by||''):'본인'})`).join('<br>');
  $('modalCard').innerHTML=`<h3>${esc(r.name)}</h3><div class="z">${esc(r.zoneName)} 담당</div>
    <div class="phone">${esc(r.phone)}</div><div class="hint">PDA 번호 · 사무실 전화 원터치 연결은 향후 전화 시스템 연동 과제</div>
    <dl class="kv"><dt>현재 상태</dt><dd><span class="pill" style="background:${SH[r.status][1]}">${SH[r.status][0]}</span></dd>
      <dt>아픈 곳</dt><dd>${esc(r.memo)||'-'}</dd>
      <dt>보고</dt><dd>${r.source==='control'?`관제 확인 · ${esc(r.by)} · ${hm(r.at)} · ${esc(r.note)}`:r.at?`본인 보고 · ${hm(r.at)}`:'아직 보고 없음'}</dd></dl>
    ${hist?`<div class="hist"><b>이전 기록</b><br>${hist}</div>`:''}
    <div style="margin-top:14px;font-size:12.5px;font-weight:800;color:var(--ink-2)">연락해서 확인한 뒤 상태 수정</div>
    <input id="shNote" value="전화 확인" maxlength="100">
    <div class="acts">${['ok','pain','injury'].map(s=>`<button class="btn" style="border-color:${SH[s][1]};color:${SH[s][1]}" onclick="setShift('${id}','${s}')">${SH[s][0]}</button>`).join('')}</div>
    <div class="acts"><button class="btn" style="flex:1" onclick="closeModal()">닫기</button></div>`;
  $('modal').classList.add('on');
}
async function setShift(id,status){
  try{ await api('/api/safety/shift/'+id,{method:'PATCH',body:JSON.stringify({status,note:$('shNote').value})}); closeModal(); toast('관제 확인으로 수정했습니다'); load(); }
  catch(e){ toast(e.message); }
}
function personModal(id,alertId){
  const r=S.roster.find(x=>x.id===id); const a=S.alerts.find(x=>x.id===alertId);
  $('modalCard').innerHTML=`<h3>${esc(r.name)}</h3><div class="z">${esc(zoneName(r.zone))} 담당 · 긴급 알림 미확인</div>
    <div class="phone">${esc(r.phone)}</div><div class="hint">사무실 전화로 연락해 주세요. 원터치 연결은 향후 전화 시스템 연동 과제입니다.</div>
    <dl class="kv"><dt>알림</dt><dd>${hm(a.createdAt)} ${esc(a.text)}</dd></dl>
    <div class="acts"><button class="btn" style="flex:1" onclick="closeModal()">닫기</button></div>`;
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }

boot();
</script>

<script>
(function(){
const E=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&quot;'}[c]));
async function refreshON(){if(!window.me||me.kind!=='safety')return;
 try{const d=await api('/api/on/returns');const c=d.summary,el=document.getElementById('on-return-content');
 el.innerHTML=`<p style="font-size:12px;color:#666">${E(d.date)} · ${E(d.rosterSource)}</p><p><b>대상 ${c.target}명 / 귀국보고 ${c.reported}명 / 미보고 ${c.missing}명 / 신체 이상 ${c.body}명 / 장비 이상 ${c.equipment}명 / 이상 보고자 ${c.issue}명 / 조치 대기 ${c.actionPending}명</b></p>`+
 d.rows.map(r=>`<div style="padding:10px;border-top:1px solid #ddd"><b>${E(r.name)} · ${E(r.zoneName)}</b> ${r.report?`귀국 ${E(new Date(r.report.at).toLocaleTimeString('ko-KR'))} / 신체: ${r.report.bodyIssue?E(r.report.bodyDetail):'없음'} / 장비: ${r.report.equipmentIssue?E(r.report.equipmentDetail):'없음'}`:'<b style="color:#b91c1c">미보고</b>'}
 ${r.report&&(r.report.bodyIssue||r.report.equipmentIssue)?`<div>조치: ${E(r.action?.status||'대기')} ${E(r.action?.detail||'')}</div><button class="btn" data-action="${E(r.id)}">조치사항 기록</button>`:''}</div>`).join('');
 el.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{const id=b.dataset.action,row=d.rows.find(r=>r.id===id),prev=row.action||{};
 const detail=prompt('실제 조치사항을 입력하세요',prev.detail||'');if(detail===null)return;const owner=prompt('조치 담당자',prev.owner||me.name);if(owner===null)return;const status=prompt('조치 상태: pending / in_progress / done',prev.status||'in_progress');if(status===null)return;
 try{await api('/api/on/returns/'+encodeURIComponent(id)+'/action',{method:'POST',body:JSON.stringify({date:d.date,detail,owner,status})});refreshON();}catch(e){alert(e.message);}});
 }catch(e){document.getElementById('on-return-content').textContent=e.message;}
 try{const [d,state]=await Promise.all([api('/api/on/notices'),api('/api/safety/state')]);const el=document.getElementById('on-notice-content');
 el.innerHTML=`<input id="on-notice-title" placeholder="공지 제목" style="width:100%;padding:9px;margin-bottom:7px"><textarea id="on-notice-body" placeholder="공지 내용"></textarea><div id="on-notice-targets">${state.roster.map(r=>`<label style="display:inline-block;margin:6px"><input type="checkbox" value="${E(r.id)}" checked> ${E(r.name)}</label>`).join('')}</div><button class="btn primary" id="on-notice-send">공지 발송</button><h4>발송 이력</h4>`+
 d.notices.map(n=>`<div style="border-top:1px solid #ddd;padding:8px"><b>${E(n.title)}</b> · ${E(n.sender)} · 확인 ${Object.keys(n.acks||{}).length}/${n.targets.length}<p>${E(n.body)}</p></div>`).join('');
 el.querySelector('#on-notice-send').onclick=async()=>{try{await api('/api/on/notices',{method:'POST',body:JSON.stringify({title:el.querySelector('#on-notice-title').value,body:el.querySelector('#on-notice-body').value,targets:[...el.querySelectorAll('#on-notice-targets input:checked')].map(x=>x.value)})});refreshON();}catch(e){alert(e.message);}};
 }catch(e){document.getElementById('on-notice-content').textContent=e.message;}}
setInterval(refreshON,20000);const old=window.enter;window.enter=function(...a){const r=old.apply(this,a);refreshON();return r;};
})();
</script>
</body>
</html>
