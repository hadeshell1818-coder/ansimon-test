<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>산업안전보건 관리 · 장흥우체국</title>
<link rel="stylesheet" href="/safety-workspace.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --ink:#0E1216; --ink-2:#48525C; --line:#DDE2E7; --panel:#fff; --bg:#EEF1F4; --console:#10141A;
    --post:#E4002B; --ok:#0B8A5B; --warn:#D98200; --danger:#C8102E; --ai:#1D4ED8; --ai-bg:#E8F1FF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Pretendard',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
  button,input,textarea,select{font-family:inherit;}
  button{cursor:pointer;}
  .hidden{display:none !important;}

  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 90% at 50% -10%,#232A33,#12161C 60%,#0B0E12);}
  .lg{width:100%;max-width:400px;color:#fff;}
  .lg h1{font-size:22px;margin:10px 0 4px;} .lg p{color:#AEB6BF;font-size:13px;margin:0 0 20px;}
  .lg input{width:100%;border:1px solid #2E3742;background:#141A21;color:#fff;border-radius:12px;padding:14px;font-size:15px;margin-bottom:10px;}
  .lg button{width:100%;border:none;background:var(--post);color:#fff;font-size:15px;font-weight:800;padding:15px;border-radius:12px;}
  .lg .err{color:#FF7B7B;font-size:12px;font-weight:700;min-height:16px;margin-bottom:6px;}
  .badge{background:var(--post);color:#fff;font-weight:800;font-size:11px;padding:3px 8px;border-radius:6px;}

  .top{background:var(--console);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;position:sticky;top:0;z-index:40;}
  .top .sys{font-weight:800;font-size:15px;} .top .sys small{display:block;font-size:11px;color:#8A94A0;font-weight:600;}
  .top .sp{flex:1;}
  .tbtn{border:1px solid #333B45;background:transparent;color:#C6CDD4;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;}
  .tabs{display:flex;gap:6px;padding:12px 20px 0;max-width:1200px;margin:0 auto;}
  .tab{border:1.5px solid var(--line);background:#fff;border-radius:10px 10px 0 0;padding:10px 16px;font-size:13.5px;font-weight:800;color:var(--ink-2);border-bottom:none;}
  .tab.on{background:var(--console);color:#fff;border-color:var(--console);}
  .tab .n{background:var(--post);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:6px;}
  .wrap{max-width:1200px;margin:0 auto;padding:16px 20px 60px;}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
  .ph{font-size:15px;font-weight:800;margin:0 0 4px;} .psub{font-size:12.5px;color:var(--ink-2);margin:0 0 14px;}
  .empty{border:1px dashed var(--line);border-radius:10px;padding:20px;text-align:center;color:var(--ink-2);font-size:13px;}

  /* 대기함 카드 */
  .inbox-card{border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:12px;padding:14px;margin-bottom:12px;display:flex;gap:14px;}
  .inbox-card.carrier{border-left-color:var(--danger);}
  .inbox-card img{width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:0 0 auto;cursor:zoom-in;background:#F3F5F7;}
  .noimg{width:120px;height:120px;border-radius:10px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:12px;text-align:center;flex:0 0 auto;}
  .ic-body{flex:1;min-width:0;}
  .ic-meta{font-size:12.5px;color:var(--ink-2);font-weight:700;}
  .ic-meta .who{color:var(--ink);font-size:14px;font-weight:800;}
  .src-tag{font-size:11px;font-weight:800;border-radius:5px;padding:2px 7px;color:#fff;}
  .src-carrier{background:var(--danger);} .src-staff{background:var(--ok);} .src-transfer{background:#6D28D9;}
  .ai-box{background:var(--ai-bg);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.6;}
  .advice-edit-row{display:grid;grid-template-columns:88px 1fr auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid rgba(84,125,166,.25);}
  .advice-edit{min-height:28px;padding:4px 6px;background:#fff;border:1px solid var(--line);border-radius:5px;white-space:pre-wrap;outline:0;}
  .advice-edit:focus{border-color:var(--ai);box-shadow:0 0 0 2px rgba(84,125,166,.12)}
  .ai-box .tag{background:var(--ai);color:#fff;font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 7px;margin-right:6px;}
  .ai-box b{color:var(--ai);}.risk-chat-row{display:flex;align-items:center;gap:16px;margin-top:6px}.risk-chat-row textarea{flex:1;min-width:0;margin:0;min-height:64px}.risk-chat-row .btn{flex:0 0 auto;margin-left:auto;white-space:nowrap}
  .row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .btn{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:800;color:var(--ink);}
  .btn.primary{background:var(--console);border-color:var(--console);color:#fff;}
  .btn.danger{border-color:var(--danger);color:var(--danger);}
  .btn:disabled{opacity:.5;cursor:default;}

  /* 위험성평가표 */
  .ratable{width:100%;table-layout:fixed;border-collapse:collapse;font-size:11px;}
  .ratable th,.ratable td{border:1px solid var(--line);padding:5px 4px;vertical-align:middle;text-align:center;overflow-wrap:anywhere;}
  .ratable th{background:#F4F6F8;font-weight:800;color:var(--ink-2);white-space:normal;}
  .ratable td.l{text-align:left;}
  .ratable .factor{width:12%;} .ratable .ctrl{white-space:pre-line;}
  .ratable img.risk-row-photo{width:48px;height:42px;display:block;margin:0 0 4px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:zoom-in;}
  .ratable .result-cell .btn{padding:5px 6px;font-size:10px;white-space:normal;}
  .ratable td.center-edit{text-align:center;}
  .ratable td.center-edit>div{height:100%;min-height:24px;display:flex;align-items:center;justify-content:center;line-height:1.35;}
  .file-icon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid var(--line);border-radius:5px;background:#f4f6f8;font-size:17px;line-height:1;}
  .ratable img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;}
  .assessment-layout{display:block;}
  .assessment-layout>div{min-width:0;}
  .criteria-panel{border:1px solid var(--line);border-radius:10px;background:#F8FAFC;padding:0;margin:0 0 12px;}
  .criteria-panel summary{cursor:pointer;font-weight:800;padding:10px 12px;list-style-position:inside;}
  .criteria-body{padding:0 12px 12px;}
  .criteria-rule{background:#10141A;color:#fff;border-radius:7px;padding:7px;text-align:center;font-weight:800;margin-bottom:8px}
  .criteria-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}
  .criteria-col{min-width:0;padding:8px;background:#EEF2F5;border-radius:7px}
  .criteria-panel h4{font-size:12px;margin:0 0 5px}.criteria-list{display:grid;gap:4px}.criteria-item{font-size:10.5px;line-height:1.3;padding:5px 6px;border-left:3px solid #CBD5E1;background:#fff}.criteria-item b{margin-right:4px}
  .criteria-note{font-size:11px;color:var(--ink-2);line-height:1.5;margin:10px 0 0}.risk-band{display:block;font-size:10px;color:var(--ink-2);margin-top:2px}.evidence-item,.case-result label{cursor:pointer}
  .score{width:44px;text-align:center;border:1.5px solid var(--line);border-radius:7px;padding:6px 2px;font-size:14px;font-weight:800;}
  .score.ai{border-color:var(--ai);background:var(--ai-bg);}
  .rv{font-size:16px;font-weight:800;}
  .allow{font-size:11.5px;font-weight:800;border-radius:5px;padding:2px 7px;color:#fff;display:inline-block;}
  .allow.ok{background:var(--ok);} .allow.no{background:var(--danger);}
  .mini{border:1.5px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12.5px;width:100%;}
  .mini:focus,.score:focus{outline:none;border-color:var(--ai);}
  .aihint{font-size:11px;color:var(--ai);margin-top:3px;cursor:pointer;text-decoration:underline;}
  .save-row{font-size:11px;color:var(--ink-2);}
  .st-pill{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;color:#fff;}
  .st-assessing{background:var(--warn);} .st-assessed{background:var(--ai);} .st-done{background:var(--ok);}

  /* 청 보고 */
  .rep-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0;}
  .rep-card{background:#F7F9FA;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
  .rep-card .n{font-size:30px;font-weight:800;} .rep-card .l{font-size:12px;color:var(--ink-2);font-weight:700;margin-top:4px;}
  .rep-sec{margin-top:16px;} .rep-sec h4{font-size:13px;margin:0 0 8px;}
  .imp-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 10px;background:#F7F9FA;border-radius:9px;margin-bottom:6px;}
  .arrow{font-weight:800;color:var(--ok);}
  .datasrc{font-size:11.5px;color:var(--ink-2);margin-top:10px;}

  .modal{position:fixed;inset:0;background:rgba(10,14,18,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal.on{display:flex;}
  .card{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto;}
  .card h3{margin:0 0 12px;font-size:18px;}
  .fld{margin-bottom:12px;} .fld label{display:block;font-size:12px;font-weight:800;color:var(--ink-2);margin-bottom:5px;}
  .fld input,.fld textarea,.fld select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;}
  .fld textarea{min-height:60px;resize:vertical;}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200;}
  .lb.on{display:flex;} .lb img{max-width:92%;max-height:92%;border-radius:8px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--console);color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.25s;z-index:300;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media(max-width:820px){.rep-grid{grid-template-columns:repeat(2,1fr);} .wrap{padding:12px;} .ratable{font-size:9px}.ratable th,.ratable td{padding:3px 2px}.ratable img{width:40px;height:40px}.score{width:30px;padding:4px 0}.result-cell .btn{font-size:8px!important;padding:3px 2px!important}.criteria-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.criteria-col:last-child{grid-column:1/-1}}
  @media(max-width:520px){.criteria-grid{grid-template-columns:1fr}.criteria-col:last-child{grid-column:auto}}
  @media print{.top,.tabs,#on-knowledge,.row-btns,.btn,.aihint,.toast{display:none!important}.modal{display:none}.modal.on{display:flex!important;position:static;background:transparent;padding:0}.modal.on .card{max-width:none;max-height:none;box-shadow:none;border:0}body{background:#fff}.wrap{max-width:none;padding:0}.panel{border:0;padding:0}.assessment-layout{display:block}.criteria-panel{position:static;margin-bottom:12px}.ratable{font-size:9px}.ratable input{border:0;width:28px}.ratable th,.ratable td{padding:4px}}
</style>
<style id="risk-form-style">
.month-summary{display:none!important}
.process-evaluator{margin-left:auto;text-align:right}
.criteria-table{width:100%;border-collapse:collapse;font-size:12px}.criteria-table th,.criteria-table td{border:1px solid #aab2ba;padding:8px}.criteria-detail{white-space:pre-line}.level-red{background:#ffe3e5;color:#9e1824}.level-yellow{background:#fff0b5;color:#604900}.level-green{background:#dcf4e4;color:#176337}
.assessment-meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:16px 0}.three-step td{white-space:pre-wrap}.three-step select{max-width:100%;padding:5px;border:1px solid #aab2ba}.three-step small{display:block;font-size:10px}.screen-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}.screen-actions .btn{padding:4px 7px;font-size:11px}.result-form{max-width:760px;margin:auto}.result-form h2{text-align:center;border:1px solid #777;padding:16px;font-size:20px}.result-number{border:1px solid #777;padding:12px;margin:18px 0}.result-photos{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0}.result-photos>div{border:1px solid #777}.result-photo{height:240px;display:flex;align-items:center;justify-content:center}.result-photo img{width:100%;max-height:230px;object-fit:contain}.result-caption{text-align:center;border-top:1px solid #777;background:#eee;padding:8px;font-weight:700}.result-form table{width:100%;border-collapse:collapse;table-layout:fixed;margin:18px 0;font-size:12px}.result-form th,.result-form td{border:1px solid #777;padding:9px;white-space:pre-wrap;overflow-wrap:anywhere}.result-form th{background:#eee}.result-measures th{width:20%}.result-measures td{height:110px}.result-plan th:first-child{width:20%}.result-plan td{height:35px}.result-appendix{margin:24px 0}.result-appendix p{white-space:pre-wrap;overflow-wrap:anywhere}.result-appendix img{width:45%;max-height:240px;object-fit:contain;margin:6px}.card:has(.result-form){max-width:850px}
.process-group{margin:18px 0 26px}.process-group>header{display:flex;align-items:center;gap:10px;margin:10px 0}.process-name-edit{font-size:14px;font-weight:700;max-width:360px;min-width:150px;padding:4px 7px;border:1px solid #c8d0d8;border-radius:4px;background:#f7f9fa}.process-evaluator{font-size:14px;font-weight:700;color:var(--ink-2)}.direct-edit{cursor:text;min-height:40px}.direct-edit>div{min-height:24px;outline:0}.direct-edit:focus-within{box-shadow:inset 0 0 0 2px #547da6;background:#f7fbff}.direct-edit:empty:before{content:'클릭해 입력';color:#8a949e}
.assessment-toolbar{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin:14px 0}.assessment-toolbar label{display:grid;gap:4px;font-size:12px;font-weight:700}.assessment-toolbar input,.assessment-toolbar select{padding:8px;border:1px solid var(--line);border-radius:5px;background:#fff}.period-presets{display:flex;gap:5px;flex-wrap:wrap}.period-presets .btn{padding:7px 9px}.month-summary{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:8px;margin:12px 0 18px}.month-summary div{border:1px solid var(--line);background:#f7f9fa;padding:10px}.month-summary span{font-size:12px;color:var(--ink-2)}.month-summary b{display:block;font-size:20px;margin-top:4px}.form-section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.form-section h4{margin:0 0 10px;font-size:15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ai-draft-action{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}.ai-draft-action small{flex:1;min-width:220px}
@media(max-width:700px){.month-summary{display:none!important}.form-grid{grid-template-columns:1fr}}
@media(max-width:600px){.three-step select{appearance:none;width:100%;padding:5px 0;text-align:center;font-size:12px}.result-photos{gap:8px}.result-photo{height:170px}.result-photo img{max-height:160px}.result-form th,.result-form td{padding:5px;font-size:11px}}
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="lg">
    <span class="badge">우체국</span>
    <h1>위험성평가 · 안전보건</h1>
    <p>총괄국 안전보건담당자 계정으로 로그인하세요.</p>
    <input id="lid" placeholder="아이디" autocapitalize="off" onkeydown="if(event.key==='Enter')doLogin()">
    <input id="lpw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="err" id="lerr"></div>
    <button onclick="doLogin()">로그인</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="top">
    <span class="badge">우체국</span>
    <div class="sys">산업안전보건 관리<small id="who">—</small></div>
    <div class="sp"></div>
    <button class="tbtn" onclick="logout()">로그아웃</button>
  </div>
  <div id="on-knowledge" role="status">안전지식 저장소: 확인 중</div>
<div class="tabs" aria-label="안전관리 업무">
    <button class="tab on" id="tab-inbox" onclick="setTab('inbox')">내부위험 접수 <span class="n hidden" id="inboxN"></span></button>
    <button class="tab" id="tab-table" onclick="setTab('table')">위험성평가표</button>
    <button class="tab" id="tab-library" onclick="setTab('library')">근거자료실</button>
  </div>
  <div class="wrap" id="content"></div>
</div>

<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
<div class="lb" id="lb" onclick="this.classList.remove('on')"><img id="lbImg" src="" alt=""></div>
<div class="toast" id="toast"></div>

<script src="/safety-workspace.js"></script><script src="/risk-reference.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=iso=>{const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
const localDate=value=>{const d=value?new Date(value):new Date();const offset=d.getTimezoneOffset()*60000;return new Date(d-offset).toISOString().slice(0,10)};
let token=sessionStorage.getItem('cv_risk_token')||null, me=null, R=null, ws=null, poll=null, tab='inbox', reportData=null, reportDays=30, assessmentStart=localDate(new Date(new Date().getFullYear(),new Date().getMonth(),1)), assessmentEnd=localDate();
let riskAdviceDraft=null, processOutput='', riskAdviceSession=null;

async function api(path,opts={}){
  opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(token) opts.headers.Authorization='Bearer '+token;
  const r=await fetch(path,opts);
  if(r.status===401){ logout(); throw new Error('다시 로그인하세요'); }
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||'요청 실패');
  return d;
}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}
function lightbox(src){ $('lbImg').src=src; $('lb').classList.add('on'); }

async function boot(){
  if(token){ try{ const d=await api('/api/me'); if(d.user.kind==='safety_mgr'){ me=d.user; return enter(); } }catch(e){} }
  $('login').classList.remove('hidden');
}
async function doLogin(){
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('lid').value.trim(),pw:$('lpw').value})});
    const d=await r.json();
    if(!r.ok){ $('lerr').textContent=d.error||'로그인 실패'; return; }
    if(d.user.kind!=='safety_mgr'){ $('lerr').textContent='안전보건담당자 계정이 아닙니다.'; return; }
    token=d.token; me=d.user; sessionStorage.setItem('cv_risk_token',token); enter();
  }catch(e){ $('lerr').textContent='서버 연결 실패'; }
}
function logout(){
  if(token) fetch('/api/logout',{method:'POST',headers:{Authorization:'Bearer '+token}}).catch(()=>{});
  token=null; me=null; sessionStorage.removeItem('cv_risk_token');
  if(ws){ ws.onclose=null; try{ws.close();}catch(e){} } clearInterval(poll);
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
}
function enter(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('who').textContent=`${me.org} · ${me.name}`;
  const proto=location.protocol==='https:'?'wss':'ws';
  const open=()=>{ if(!token) return; ws=new WebSocket(`${proto}://${location.host}?token=${token}`);
    ws.onmessage=e=>{ try{ const t=JSON.parse(e.data).type; if(t==='risk'||t==='safety') load(); }catch(_){} };
    ws.onclose=()=>{ if(token) setTimeout(open,3000); }; };
  open(); poll=setInterval(load,60000); load();
  refreshKnowledge();
}
function setTab(t){ tab=t; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id==='tab-'+t)); render(); }

async function load(){
  try{ R=await api('/api/risk/state'); }catch(e){ return; }
  $('inboxN').textContent=R.inbox.length; $('inboxN').classList.toggle('hidden',!R.inbox.length);
  if(['inbox','table','report','actions'].includes(tab)) render();
}
const procName=id=>R.processes.find(p=>p.id===id)?.name||'-';

function assessmentDate(it){return String(it.assessmentStartedAt||it.triagedAt||it.createdAt||'').slice(0,10)}
function assessmentRows(){return R.registered.filter(it=>['assessing','assessed','done'].includes(it.status)&&assessmentDate(it)>=assessmentStart&&assessmentDate(it)<=assessmentEnd).sort((a,b)=>String(a.assessmentStartedAt||a.triagedAt||a.createdAt).localeCompare(String(b.assessmentStartedAt||b.triagedAt||b.createdAt)))}
function assessmentProcess(it){return it.customProcess||it.assessmentTarget||procName(it.proc)||'미지정 공정'}
function assessmentGroups(rows){const groups=new Map();rows.forEach(it=>{const key=assessmentProcess(it);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(it)});return [...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ko'))}
function editableCell(it,field,value){const center=['dueDate','owner'].includes(field);return '<td class="'+(center?'center-edit':'l')+' direct-edit"><div contenteditable="true" role="textbox" tabindex="0" aria-label="'+esc(field)+' 직접 수정" data-id="'+esc(it.id)+'" data-field="'+field+'" onblur="saveRiskCell(this)">'+esc(value||'')+'</div></td>'}
function numberedText(value){return String(value||'').split(/\n+/).map(x=>x.trim().replace(/^[-*•]\s*/,'').replace(/^\d+[.)]\s*/, '')).filter(Boolean).map((x,i)=>(i+1)+'. '+x).join('\n')}
function assessmentTable(rows,print=false){
 return '<table class="ratable three-step"><colgroup><col style="width:4%"><col style="width:18%"><col style="width:8%"><col style="width:17%"><col style="width:7%"><col style="width:7%"><col style="width:7%"><col style="width:8%"><col style="width:8%"><col style="width:8%"><col style="width:8%"></colgroup><thead><tr><th>번호</th><th>유해·위험요인<br>(위험한 상황과 사건)</th><th>위험성의 수준<br>(상,중,하)</th><th>개선대책</th><th>개선<br>예정일</th><th>개선<br>완료일</th><th>담당자</th><th>이행결과서</th><th>관련근거<br>(선택사항)</th><th>위험성<br>평가표</th><th>접수내역</th></tr></thead><tbody>'+rows.map((it,i)=>rowHtml(it,i,print)).join('')+'</tbody></table>';
}
function renderTable(){
 const rows=assessmentRows();
 const groups=assessmentGroups(rows);
 const processes=groups.map(([name])=>name);
 if(!processes.includes(processOutput)) processOutput='';
 const grouped=groups.map(([name,items])=>{const evaluators=[...new Set(items.map(it=>it.evaluator||it.assessedBy).filter(Boolean))];return '<section class="process-group"><header><input class="process-name-edit" aria-label="공정명 직접 수정" value="'+esc(name)+'" data-ids="'+esc(JSON.stringify(items.map(x=>x.id)))+'" onchange="saveProcessGroup(this)"><span class="process-evaluator">평가자: '+esc(evaluators.join(', ')||'-')+'</span></header>'+assessmentTable(items)+'</section>'}).join('');
 const count=level=>rows.filter(it=>it.riskLevel===level).length;
 const label=assessmentStart+' ~ '+assessmentEnd;
 $('content').innerHTML='<div class="panel"><div class="ph">위험성평가표</div>'+criteriaHtml()+'<div class="assessment-toolbar"><button class="btn primary" onclick="openManualRisk()">위험성평가 추가</button><label>조회 시작<input type="date" value="'+esc(assessmentStart)+'" onchange="assessmentStart=this.value;renderTable()"></label><label>조회 종료<input type="date" value="'+esc(assessmentEnd)+'" onchange="assessmentEnd=this.value;renderTable()"></label><div class="period-presets"><button class="btn" onclick="setAssessmentRange(0)">일별</button><button class="btn" onclick="setAssessmentRange(3)">3개월</button><button class="btn" onclick="setAssessmentRange(6)">6개월</button><button class="btn" onclick="setAssessmentRange(12)">1년</button></div><button class="btn" onclick="downloadRiskExcel()">엑셀 다운로드</button><button class="btn" onclick="printAssessment()">위험성평가표 출력</button><select aria-label="출력할 공정" onchange="processOutput=this.value"><option value="">공정 선택</option>'+processes.map(name=>'<option value="'+esc(name)+'" '+(name===processOutput?'selected':'')+'>'+esc(name)+'</option>').join('')+'</select><button class="btn" onclick="printSelectedProcess()">공정별 출력</button></div><div class="psub">'+esc(label)+' 위험성평가 집계</div><div class="month-summary"><div><span>전체</span><b>'+rows.length+'</b></div><div><span>상</span><b>'+count('상')+'</b></div><div><span>중</span><b>'+count('중')+'</b></div><div><span>하</span><b>'+count('하')+'</b></div><div><span>개선완료</span><b>'+rows.filter(it=>it.status==='done').length+'</b></div></div><div class="assessment-layout">'+(grouped||'<div class="empty">선택한 기간의 평가 항목이 없습니다.</div>')+'</div></div>';
}
function rowHtml(it,index,print=false){
 const options=['상','중','하'].map(x=>'<span>'+(it.riskLevel===x?'☑':'☐')+' '+x+'</span>').join(' ');
 const st={assessing:'평가중',assessed:'평가완료',done:'개선완료'}[it.status]||'',result=it.doneAt||it.resultUpdatedAt;

 const resultButton=result?'<button class="btn" title="이행결과서 열기" aria-label="이행결과서 열기" onclick="showResult(\''+esc(it.id)+'\')"><span class="file-icon">▤</span></button>':'<button class="btn" onclick="openImprove(\''+esc(it.id)+'\')">작성</button>';

 const intakeCell=print?(intake?esc(`${intake.reporter} · ${String(intake.createdAt||'').slice(0,10)} · ${intake.status||''}`):'-'):(intake?'<button class="btn" onclick="showIntake(\''+esc(it.id)+'\')">원문</button>':'-');

 return '<tr><td>'+(index+1)+'</td>'+factorCell+'<td>'+(print?options:'<select aria-label="위험성 수준" onchange="saveRiskLevel(\''+esc(it.id)+'\',this.value)">'+riskLevelOptions(it.riskLevel)+'</select>')+(!it.riskLevel?'<small>'+esc(levelText(it))+'</small>':'')+'</td>'+ (print?'<td class="l">'+esc(numberedText(it.reduction))+'</td><td>'+esc(it.dueDate||'')+'</td><td>'+esc(it.completedDate||(it.doneAt?it.doneAt.slice(0,10):''))+'</td><td>'+esc(it.owner||'')+'</td>':editableCell(it,'reduction',numberedText(it.reduction))+editableCell(it,'dueDate',it.dueDate)+ '<td>'+esc(it.completedDate||(it.doneAt?it.doneAt.slice(0,10):''))+'</td>'+editableCell(it,'owner',it.owner))+'<td class="result-cell">'+(print?'작성':resultButton)+'</td>'+(print?'<td class="l">'+esc(numberedText(RiskReferences.conciseReferences(it.referenceText)))+'</td>':editableCell(it,'referenceText',numberedText(RiskReferences.conciseReferences(it.referenceText))))+(print?'<td>'+formLabel+'</td>':'<td class="result-cell"><button class="btn" onclick="editRow(\''+esc(it.id)+'\')">'+formLabel+'</button></td>')+'<td class="result-cell">'+intakeCell+'</td></tr>';
}

function printAssessment(){const rows=assessmentRows();if(!rows.length){toast('출력할 평가 항목이 없습니다.');return}const groups=new Map();rows.forEach(it=>{const name=assessmentProcess(it);if(!groups.has(name))groups.set(name,[]);groups.get(name).push(it)});return printRiskDocument('위험성평가표','<h1>위험성평가표</h1><p>조회기간 '+esc(assessmentStart)+' ~ '+esc(assessmentEnd)+'</p>'+[...groups].map(([name,items])=>'<section><h2>공정명: '+esc(name)+'</h2>'+assessmentPrintTable(items)+'</section>').join(''),true)}

function fileToDataUrl(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height,M=1600;if(w>M||h>M){const s=M/Math.max(w,h);w=(w*s)|0;h=(h*s)|0;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.82));};img.onerror=rej;img.src=e.target.result;};r.onerror=rej;r.readAsDataURL(f);});}

async function requestRiskAdvice(id,answerQuestions=false){

    const origin=({external:'외부 공식자료',mixed:'Supabase 및 외부 공식자료',internal:'Supabase 자료',none:'확인된 근거 없음'})[d.sourceOrigin]||'근거 확인 필요';

  try{
    const references=RiskReferences.legalReferences(d);
    const body={reduction:numberedText((d.measures||[]).join('\n')),referenceText:numberedText(references.join('\n')),evidenceIds:[...new Set([...(it.evidenceIds||[]),...(d.citations||[])])],fieldReview:[d.rationale,...(d.review.additionalChecks||[])].filter(Boolean).join('\n'),aiAdvice:{description:session.proposalDescription,answers:session.answers,conversation:session.conversation,rationale:d.rationale,limitations:d.limitations,evidence:d.evidence||[],review:d.review,sourceOrigin:d.sourceOrigin}};
    const saved=await api('/api/risk/items/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(body)});Object.assign(it,saved.item);
    if(riskAdviceSession!==session)return;riskAdviceDraft=d;session.proposal=null;selectedEvidence=body.evidenceIds.map(id=>({id,title:id}));$('risk-advice-result').innerHTML='<div class="ai-box"><b>대화로 수정한 개선대책</b><p style="white-space:pre-wrap">'+esc(body.reduction)+'</p><p>'+esc(d.rationale||'')+'</p>'+riskAdviceSources(d)+'</div>';$('risk-chat-proposal').textContent='수정 대책과 검토 대화를 저장했습니다.';toast('수정안을 반영했습니다.');
  }catch(error){toast(error.message);button.disabled=false;}
}
function closeModal(){ riskAdviceSession=null;$('modal').classList.remove('on'); }

/* ---------- 청 보고 ---------- */
async function renderReport(){
  $('content').innerHTML=`<div class="panel">
    <div class="ph">청 누적 보고</div>
    <div class="psub">기간을 선택하면 그동안 쌓인 위험성평가·개선 실적이 자동 집계됩니다. 그대로 전남지방우정청에 제출할 수 있습니다.</div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
      <span style="font-weight:800;font-size:13px">기간</span>
      ${[30,60,90].map(d=>`<button class="btn ${reportDays===d?'primary':''}" onclick="setDays(${d})">최근 ${d}일</button>`).join('')}
      <button class="btn" onclick="window.print()" style="margin-left:auto">인쇄</button>
    </div>
    <div id="repBody"><div class="empty">불러오는 중…</div></div>
  </div>`;
  try{ reportData=await api('/api/risk/report-summary?days='+reportDays); renderRepBody(); }
  catch(e){ $('repBody').innerHTML=`<div class="empty">${esc(e.message)}</div>`; }
}
function setDays(d){ reportDays=d; renderReport(); }
function renderRepBody(){
  const r=reportData;
  const el=$('repBody'); if(!el) return;
  el.innerHTML=`
    <div style="font-size:13px;color:var(--ink-2);margin-bottom:4px">${r.office} · ${new Date(r.generatedAt).toLocaleDateString('ko-KR')} 생성 · 최근 ${r.days}일</div>
    <div class="rep-grid">
      <div class="rep-card"><div class="n">${r.total}</div><div class="l">평가 등록</div></div>
      <div class="rep-card"><div class="n" style="color:var(--danger)">${r.highRisk}</div><div class="l">허용불가(상·중)</div></div>
      <div class="rep-card"><div class="n" style="color:var(--ok)">${r.actionRate==null?'-':r.actionRate+'%'}</div><div class="l">상·중 조치율</div></div>
      <div class="rep-card"><div class="n" style="color:var(--warn)">${r.pending}</div><div class="l">미조치 잔여</div></div>
    </div>
    ${r.byProc.length?`<div class="rep-sec"><h4>공정별 분포</h4>${r.byProc.map(p=>`<div class="imp-row"><span style="flex:1">${esc(p.proc)}</span><b>${p.count}건</b></div>`).join('')}</div>`:''}
    <div class="rep-sec"><h4>내부위험 접수 처리 이력</h4><div class="imp-row"><span style="flex:1">접수 건수</span><b>${r.internalIntakeTotal||0}건</b></div><div class="imp-row"><span style="flex:1">위험성평가 대기·진행</span><b>${r.internalIntakePending||0}건</b></div>${(r.internalIntakes||[]).map(i=>`<details class="detailbox"><summary>${esc(i.reporter)} · ${esc(i.createdAt?new Date(i.createdAt).toLocaleString('ko-KR'):'-')} · ${esc(i.handlingStatus)}</summary><div>신고번호: ${esc(i.reportId)}<br>주소: ${esc(i.addr||'-')}<br>신고내용: ${esc(i.note||'내용 없음')}<br>처리담당: ${esc(i.handledBy||'-')} · 처리시각: ${esc(i.handledAt?new Date(i.handledAt).toLocaleString('ko-KR'):'-')}</div></details>`).join('')||'<div class="datasrc">해당 기간 내부위험 접수 없음</div>'}</div>
    ${r.improved.length?`<div class="rep-sec"><h4>개선 전/후 위험성 감소</h4>${r.improved.map(i=>`<div class="imp-row"><span style="flex:1">${esc(i.proc||'')} · ${esc((i.factor||'').slice(0,30))}</span><b>${i.before}</b> <span class="arrow">→</span> <b style="color:var(--ok)">${i.after}</b></div>`).join('')}</div>`:''}
    <div class="datasrc">3단계 평가 미완료·재검토 대상: ${r.reviewRequired||0}건</div>`;
}
boot();
</script>
