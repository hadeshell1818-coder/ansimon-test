<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10141A">
<title>AI 안심ON</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="안심ON">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--ink:#0E1216;--ink-2:#3A4550;--screen:#F9FAFB;--line:#D3DAE0;--console:#10141A;
    --post:#E4002B;--safe:#C70026;--env:#0B8A5B;--welfare:#0E44A8;--gps:#0B8A5B;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:'Pretendard',system-ui,sans-serif;background:var(--screen);color:var(--ink);}
  .app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  .top{background:var(--console);color:#fff;padding:11px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:30;}
  .badge{background:var(--post);color:#fff;font-weight:800;font-size:10px;padding:2px 6px;border-radius:5px;flex:0 0 auto;white-space:nowrap;}
  .top .t{font-size:13px;font-weight:800;flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .top .t small{display:block;font-size:10px;color:#8A94A0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top .out{margin-left:auto;flex:0 0 auto;border:1px solid #333B45;background:transparent;color:#C6CDD4;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;white-space:nowrap;}
  .wrap{flex:1;padding:16px;}

  /* 로그인 */
  #login{display:flex;flex-direction:column;justify-content:center;min-height:100vh;padding:26px;background:radial-gradient(120% 90% at 50% -10%,#232A33,#12161C 60%,#0B0E12);color:#fff;}
  .lg-brand{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
  .lg-h{font-size:22px;font-weight:800;margin:8px 0 4px;} .lg-s{font-size:13px;color:#AEB6BF;margin-bottom:22px;}
  .lg-in{border:1px solid #2E3742;background:#141A21;color:#fff;border-radius:12px;padding:14px 15px;font-size:15px;font-family:inherit;margin-bottom:10px;width:100%;}
  .lg-in:focus{outline:none;border-color:var(--post);}
  .lg-btn{width:100%;border:none;background:var(--post);color:#fff;font-size:15px;font-weight:800;padding:15px;border-radius:12px;}
  .lg-err{color:#FF7B7B;font-size:12px;font-weight:700;min-height:16px;margin:2px 0 6px;}
  .lg-note{font-size:11px;color:#7A828B;margin-top:16px;text-align:center;}

  .install-banner{display:flex;align-items:center;gap:10px;background:#10141A;color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:14px;}
  .ib-text{flex:1;font-size:12px;line-height:1.5;color:#C6CDD4;} .ib-text b{color:#fff;font-size:12.5px;}
  .ib-close{flex:0 0 auto;background:transparent;border:none;color:#8A94A0;font-size:16px;font-weight:800;padding:2px 6px;}
  .prof{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:16px;}
  .prof .av{width:44px;height:44px;border-radius:11px;background:#3A434E;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .prof .nm{font-size:16px;font-weight:800;} .prof .og{font-size:12px;color:var(--ink-2);font-weight:600;margin-top:2px;}

  .lead{font-size:12px;font-weight:800;color:var(--ink-2);margin:2px 0 3px;}
  .h{font-size:20px;font-weight:800;margin:0 0 13px;}
  .cats{display:flex;flex-direction:column;gap:11px;}
  .cat{border:none;text-align:left;border-radius:16px;padding:18px 16px;display:flex;align-items:center;gap:14px;color:#fff;box-shadow:0 5px 14px rgba(14,18,22,.14);}
  .cat:active{transform:scale(.98);}
  .cat .ci{font-size:30px;width:46px;text-align:center;}
  .cat .ctwrap{display:flex;flex-direction:column;}
  .cat .ct{font-size:18px;font-weight:800;display:block;} .cat .cs{font-size:11.5px;opacity:.92;margin-top:2px;display:block;}
  .cat.safe{background:linear-gradient(135deg,#F0324F,#C70026);}
  .cat.env{background:linear-gradient(135deg,#10A56E,#087349);}
  .cat.welfare{background:linear-gradient(135deg,#2E6BE0,#0E44A8);}

  .backrow{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .back{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink-2);}
  .tag{font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;color:#fff;}
  .subgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .sub{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:15px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px;min-height:88px;justify-content:center;}
  .sub:active{transform:scale(.96);} .sub .si{font-size:24px;} .sub .sl{font-size:13px;font-weight:700;line-height:1.2;}
  .sub.etc{background:#F3F5F7;border-style:dashed;}

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;}
  .card-h{padding:11px 13px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .card-h .opt{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--ink-2);background:#EFF2F5;padding:2px 8px;border-radius:999px;}
  .locbtn{width:100%;border:1.5px solid var(--gps);background:#E9F7F0;color:var(--gps);font-weight:800;font-size:14px;padding:13px;border-radius:11px;}
  .locmodes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
  .lmode{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:11px 6px;font-size:12.5px;font-weight:800;line-height:1.25;}
  .lmode:active{background:#F3F5F7;transform:scale(.97);}
  .addr-go{margin-top:7px;width:100%;border:none;background:var(--gps);color:#fff;border-radius:10px;padding:11px;font-size:13.5px;font-weight:800;}
  .addr-msg{font-size:12px;margin-top:6px;font-weight:600;min-height:16px;}
  #cmap{height:150px;display:none;border-radius:10px;margin-top:11px;border:1px solid var(--line);}
  .addr-in,.f-in,.memo{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;font-size:14px;font-family:inherit;}
  .addr-in:focus,.f-in:focus,.memo:focus{outline:none;border-color:var(--gps);}
  .coord{font-size:10.5px;color:var(--ink-2);margin-top:6px;font-weight:600;}
  .pin-hint{font-size:10.5px;color:var(--ink-2);margin-top:5px;}
  .pad{padding:0 13px 13px;}
  .photo-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .photo-btn{width:100%;border:1.5px dashed var(--line);background:#fff;color:var(--ink-2);font-weight:800;font-size:13px;padding:13px 6px;border-radius:11px;}
  .urgent-toggle{width:100%;border:1.5px solid var(--post);background:#fff;color:var(--post);font-weight:800;font-size:13.5px;padding:13px;border-radius:11px;margin:10px 0;}
  .urgent-toggle.on{background:var(--post);color:#fff;box-shadow:0 3px 10px rgba(228,0,43,.3);}
  .thumb{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin:0 13px 12px;}
  .fld{padding:0 13px 12px;} .fld .fl{font-size:11px;font-weight:800;color:var(--ink-2);margin:10px 0 5px;}
  .chips{display:flex;gap:7px;flex-wrap:wrap;}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:700;color:var(--ink-2);}
  .chip.on{background:var(--welfare);color:#fff;border-color:transparent;}
  .hidden{display:none !important;}
  .save{width:100%;border:none;background:var(--console);color:#fff;font-size:16px;font-weight:800;padding:16px;border-radius:13px;}
  .save:disabled{opacity:.5;} .save:active{transform:scale(.99);}
  .save-sub{font-size:11.5px;color:var(--ink-2);text-align:center;margin-top:9px;font-weight:600;}
  .done{text-align:center;padding:40px 10px;}
  .done .st{width:104px;height:104px;margin:0 auto 10px;border-radius:50%;border:3.5px solid var(--gps);display:flex;align-items:center;justify-content:center;background:rgba(11,138,91,.06);font-size:48px;color:var(--gps);}
  .done .dt{font-size:20px;font-weight:800;margin:6px 0 4px;} .done .ds{font-size:13px;color:var(--ink-2);}
  .mine-h{font-size:12px;font-weight:800;color:var(--ink-2);margin:20px 0 9px;}
  .mine{display:flex;flex-direction:column;gap:7px;}
  .mrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;}
  .mrow.clickable{cursor:pointer;}
  .mrow.clickable:active{background:#F3F5F7;}
  .mrow .tag{white-space:nowrap;flex:0 0 auto;}
  .cancel-report-btn{width:100%;border:1.5px solid var(--line);background:#fff;color:var(--post);font-weight:800;font-size:13px;padding:12px;border-radius:11px;margin-top:10px;}
  .mrow .mi{font-size:13px;font-weight:700;flex:1 1 auto;min-width:70px;} .pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap;flex:0 0 auto;margin-left:auto;}
  .row-arrow{font-size:16px;color:var(--ink-2);flex:0 0 auto;margin-left:2px;}
  .d-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #EEF1F4;font-size:13.5px;}
  .d-row:last-child{border-bottom:none;}
  .d-k{flex:0 0 78px;color:var(--ink-2);font-weight:700;}
  .d-v{flex:1;font-weight:600;line-height:1.5;}
  .save.disabled, .cancel-report-btn.disabled{opacity:.45;background:#F3F5F7;color:var(--ink-2);border-color:var(--line);}
  .mine-empty{background:#fff;border:1px dashed var(--line);border-radius:11px;padding:16px;text-align:center;color:var(--ink-2);font-size:12.5px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--console);color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.25s;z-index:2000;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .leaflet-container{font:inherit;}

  /* ===== 집배원 안전 모드 ===== */
  :root{--urgent:#C8102E;--caution:#D98200;--notice:#0E5E66;}
  .sf-ticker{display:flex;align-items:center;gap:8px;background:#FFF6E0;border-bottom:1px solid #F0D9A0;padding:8px 12px;position:sticky;top:46px;z-index:25;cursor:pointer;}
  .sf-ticker .bell{flex:0 0 auto;width:22px;height:22px;color:var(--caution);}
  .sf-ticker .track{flex:1;overflow:hidden;white-space:nowrap;min-width:0;}
  .sf-ticker .run{display:inline-block;padding-left:100%;animation:sfrun var(--dur,18s) linear infinite;font-size:13.5px;font-weight:800;color:#5A4200;}
  .sf-ticker .run span{margin-right:36px;}
  .sf-ticker .run i{font-style:normal;font-size:11px;color:#fff;border-radius:4px;padding:1px 5px;margin-right:6px;}
  @keyframes sfrun{from{transform:translateX(0)}to{transform:translateX(-100%)}}
  @media (prefers-reduced-motion:reduce){.sf-ticker .run{animation:none;padding-left:0;white-space:normal}}
  .sf-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px;}
  .sf-h{font-size:12px;font-weight:800;color:var(--ink-2);margin:0 0 10px;display:flex;align-items:center;gap:6px;}
  .sf-main{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .sf-btn{border:none;border-radius:14px;padding:18px 10px;color:#fff;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:104px;justify-content:center;}
  .sf-btn small{font-size:11px;font-weight:600;opacity:.9}
  .sf-btn:active{transform:scale(.97);}
  .sf-btn svg{width:30px;height:30px;}
  .sf-call{background:#0E5E66;} .sf-voice{background:#1F2A36;}
  .sf-shift{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;}
  .sf-shift .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
  .sf-shift button.opt{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:12px 4px;font-size:13.5px;font-weight:800;color:var(--ink);}
  .sf-shift button.opt.on{color:#fff;border-color:transparent;}
  .sf-shift button.opt.ok.on{background:#0B8A5B;} .sf-shift button.opt.pain.on{background:var(--caution);} .sf-shift button.opt.injury.on{background:var(--urgent);}
  .sf-note{font-size:11px;color:var(--ink-2);margin-top:7px;}
  .sf-mine{margin-top:10px;display:flex;flex-direction:column;gap:5px;}
  .sf-mine div{font-size:12px;background:#F5F7F9;border-radius:9px;padding:7px 9px;display:flex;gap:8px;align-items:center;}
  .sf-mine b{margin-left:auto;font-size:11px;white-space:nowrap;}
  .rec-wrap{text-align:center;padding:10px 0 4px;}
  .rec-btn{width:150px;height:150px;border-radius:50%;border:none;background:var(--urgent);color:#fff;font-size:17px;font-weight:800;box-shadow:0 8px 24px rgba(200,16,46,.3);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  .rec-btn.on{animation:recpulse 1.2s ease-in-out infinite;background:#8E0B20;}
  .rec-btn svg{width:44px;height:44px;}
  @keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(200,16,46,.45)}50%{box-shadow:0 0 0 18px rgba(200,16,46,0)}}
  .rec-time{font-size:22px;font-weight:800;margin-top:12px;font-variant-numeric:tabular-nums;}
  .rec-live{min-height:22px;font-size:14px;color:var(--ink-2);margin:8px 4px;}
  .sf-overlay{position:fixed;inset:0;z-index:3000;background:var(--urgent);color:#fff;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 22px) 22px calc(env(safe-area-inset-bottom,0px) + 22px);}
  .sf-overlay.on{display:flex;}
  .sf-overlay .ohead{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;}
  .sf-overlay .ohead svg{width:34px;height:34px;animation:bellshake 1s ease-in-out infinite;transform-origin:50% 10%;}
  @keyframes bellshake{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}}
  @media (prefers-reduced-motion:reduce){.sf-overlay .ohead svg,.rec-btn.on{animation:none}}
  .sf-overlay .ometa{font-size:12.5px;opacity:.85;margin-top:6px;}
  .sf-overlay .otext{flex:1;display:flex;align-items:center;font-size:26px;line-height:1.45;font-weight:800;word-break:keep-all;}
  .sf-overlay .ocount{font-size:12px;font-weight:700;opacity:.85;margin-bottom:8px;}
  .sf-overlay button{width:100%;border:none;background:#fff;color:var(--urgent);font-size:19px;font-weight:800;padding:20px;border-radius:16px;}
  .sf-overlay .ohint{text-align:center;font-size:12.5px;margin-top:10px;opacity:.9;}
  .sf-banner{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:2500;background:#1F2A36;color:#fff;border-radius:14px;padding:13px 14px;display:none;gap:10px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:440px;margin:0 auto;}
  .sf-banner.on{display:flex;}
  .sf-banner .lv{font-size:11px;font-weight:800;border-radius:5px;padding:2px 6px;flex:0 0 auto;margin-top:2px;}
  .sf-banner .tx{font-size:14.5px;font-weight:700;line-height:1.45;}
  .sf-modal{position:fixed;inset:0;background:rgba(10,14,18,.55);z-index:2800;display:none;align-items:flex-end;justify-content:center;}
  .sf-modal.on{display:flex;}
  .sf-sheet{background:#fff;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:80vh;overflow:auto;}
  .sf-al{border-left:4px solid var(--line);padding:8px 10px;margin-bottom:8px;background:#F7F9FA;border-radius:0 10px 10px 0;}
  .sf-al .m{font-size:11px;color:var(--ink-2);font-weight:700;margin-bottom:3px;}
  .sf-al .t{font-size:14px;font-weight:700;line-height:1.45;}

  /* 안심ON: 세 영역, 각 두 버튼 — 손그림 기반 담백한 홈 */
  .wrap{padding:14px 16px 26px;}
  .home-welcome{font-size:13px;color:#566579;margin:3px 0 16px;line-height:1.45;}
  .home-welcome b{color:#263746}.home-welcome span{display:block;font-size:11.5px;margin-top:3px}
  .home-section{border:1px solid #e4e9ec;border-radius:18px;padding:15px;margin-bottom:13px;background:#f8fafb;}
  .home-section-title{font-size:15px;font-weight:800;color:#263746;margin:0 0 12px;}
  .home-section.delivery{background:#fff6f2;border-color:#f3e3da;}
  .home-section.reporting{background:#f3f8fc;border-color:#e0eaf3;}
  .home-section.returning{background:#f2f9f5;border-color:#dcece3;}
  .home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .home-tile{min-height:92px;border:1px solid #e0e5e8;border-radius:13px;background:#fff;color:#293845;font:inherit;font-size:15px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:10px 4px;cursor:pointer;}
  .home-tile .tile-icon{font-size:23px;line-height:1.1;color:#647b85;}
  .delivery .home-tile{border-color:#ecdcd5}.delivery .tile-icon{color:#a95c48}
  .reporting .home-tile{border-color:#dce7ee}.reporting .tile-icon{color:#477b9b}
  .returning .home-tile{border-color:#d9e8dd}.returning .tile-icon{color:#50866b}
  .home-tile:active,.history-link:active{transform:scale(.985);background:#f8fafb;}
  .history-link{width:100%;border:1px solid #e4e9ec;border-radius:12px;background:#fff;padding:13px 15px;text-align:left;font-size:13px;font-weight:700;color:#526374;font-family:inherit;}.history-link span{float:right;font-size:17px}
  .home-emergency-note{font-size:10.5px;color:#7b858f;text-align:center;line-height:1.5;margin-top:12px}
  .return-overlay{position:fixed;inset:0;z-index:2100;background:#f6f8f9;overflow:auto;padding:16px 16px 36px;}
  .return-overlay .return-head{max-width:480px;margin:0 auto 12px;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:800}
  .return-overlay .return-back{border:1px solid #dbe3e6;background:#fff;border-radius:10px;padding:9px 12px;font:inherit;font-size:13px}
  .return-overlay #on-return{max-width:480px;margin:auto;}
  .return-overlay #on-return .card{border:1px solid #dcece3!important;border-radius:16px;background:#fff;}
  .return-overlay #on-return label{display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:13px}
  .return-overlay #on-return input[type=radio],.return-overlay #on-return input[type=checkbox]{accent-color:#358366;width:18px;height:18px}
  .return-overlay #on-return .return-field{background:#f7faf8;border-radius:12px;padding:12px;margin-top:12px}
  .return-overlay #on-return .return-field p{margin:0 0 10px}
  .return-overlay #on-return .return-field .f-in{margin-top:9px}
</style>
</head>
<body>

<div id="login">
  <div class="lg-brand"><span class="badge">우체국</span><span style="font-size:12px;color:#9AA4AE;font-weight:700">전남지방우정청 · 파일럿</span></div>
  <div class="lg-h">AI 안심ON</div>
  <div class="lg-s">우체국 직원 생활안전·환경·복지 통합 신고 플랫폼</div>
  <input class="lg-in" id="lid" placeholder="아이디" autocapitalize="off" onkeydown="if(event.key==='Enter')doLogin()">
  <input class="lg-in" id="lpw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
  <div class="lg-err" id="lerr"></div>
  <button class="lg-btn" onclick="doLogin()">로그인</button>
  <div class="lg-note">승인된 우체국 직원 계정으로 로그인하세요.</div>
</div>

<div class="app hidden" id="app">
  <div class="top"><span class="badge">우체국</span>
    <span class="t" id="topName">AI 안심ON<small>우체국 직원 생활안전·환경·복지 통합 신고 플랫폼</small></span>

  <div class="ohead"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>긴급 안전 알림</div>

  <div class="otext" id="sfOText"></div>

</div>

<script>
/* ===== 상태 ===== */
let token=sessionStorage.getItem('cv_token')||null;
let me=null, KAKAO_KEY='', kakaoReady=false;
let cur={};
const $=id=>document.getElementById(id);
const CATS={
  safe:{label:'안전', color:'#C70026', items:[['🕳️','도로위험','파임·파손·낙하물 등'],['🚦','시설물 파손·고장','신호등·가로등·소화전·공원시설 등'],['＋','기타 안전위험요소','']]},
  env:{label:'환경', color:'#087349', items:[['🗑️','쓰레기·폐기물',''],['＋','기타 환경위험','']]},
  welfare:{label:'복지', color:'#0E44A8', items:[]}
};
const STATUS={received:['접수됨','#7C8794'],checking:['확인 중','#2563EB'],hold:['보류','#D97706'],done:['처리 완료','#0B8A5B'],noaction:['조치 불요','#9AA4AE'],cancelled:['취소됨','#B0B7C0']};
const GEO={'장흥군':{lat:34.6816,lng:126.9072},'강진군':{lat:34.6417,lng:126.7672}};
// 시/도 단위 이름(region_1depth_name)은 행정구역 통합·개편으로 카카오 쪽 표기가
// 바뀔 수 있어(예: "전남광주통합특별시") 계정 관할 판정 기준으로 쓰지 않는다.
// 항상 구/군 단위(region_2depth_name)로 판정하고, 광주 관할 자치구만 부서 계정이
// 하나로 통합돼 있는 "광주광역시"로 별도 매핑한다.
const GJ_GU = new Set(['동구','서구','남구','북구','광산구']);
function regionFromKakaoAddr(addr){
  if(!addr) return null;
  const d1=addr.region_1depth_name||'', d2=addr.region_2depth_name||'';
  if(GJ_GU.has(d2) && /광주/.test(d1)) return '광주광역시';
  return d2 || d1 || null;
}

/* ===== API ===== */
async function api(path,opts={}){
  opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(token) opts.headers.Authorization='Bearer '+token;
  const r=await fetch(path,opts);
  if(r.status===401){ logout(); throw new Error('unauthorized'); }
  if(!r.ok){
    let msg='요청 처리 중 오류가 발생했습니다 (' + r.status + ')';
    try{ const d=await r.json(); if(d&&d.error) msg=d.error; }catch(e){ /* 서버가 JSON이 아닌 오류를 반환한 경우(예: 용량 초과) */ }
    throw new Error(msg);
  }
  return r.json();
}
async function boot(){
  try{ const cfg=await (await fetch('/api/config')).json(); KAKAO_KEY=cfg.kakaoKey||''; }catch(e){}
  if(token){ try{ const d=await api('/api/me'); me=d.user; showApp(); return; }catch(e){} }
  $('login').style.display='flex'; $('app').style.display='none';
}
async function doLogin(){
  sfUnlockAudio();
  const id=$('lid').value.trim(), pw=$('lpw').value;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,pw})});
    const d=await r.json();
    if(!r.ok){ $('lerr').textContent=d.error||'로그인 실패'; return; }
    if(d.user.kind!=='carrier'){ $('lerr').textContent='집배원·직원 계정으로 로그인하세요.'; return; }
    token=d.token; me=d.user; sessionStorage.setItem('cv_token',token);
    $('lid').value='';$('lpw').value='';$('lerr').textContent='';
    showApp();
  }catch(e){ $('lerr').textContent='서버 연결 실패'; }
}
function logout(){
  if(token) fetch('/api/logout',{method:'POST',headers:{Authorization:'Bearer '+token}}).catch(()=>{});
  token=null;
  me=null;
  sessionStorage.removeItem('cv_token');
  sfStop();
  $('app').classList.add('hidden');
  $('app').style.display='none';
  $('login').style.display='flex';
}

function showApp(){
  $('login').style.display='none';
  $('app').classList.remove('hidden');
  $('app').style.display='flex';
  $('topName').innerHTML=`AI 안심ON<small>우체국 직원 생활안전·환경·복지 통합 신고 플랫폼</small>`;
  home();
  sfInit();
}

/* ===== 간결한 홈 · 신고내역은 별도 화면 ===== */
function home(){
  cur={};
  $('cw').innerHTML=`
    ${installBanner()}
    <div class="home-welcome"><b>${sfEsc(me.name)}</b> · ${sfEsc(me.org||'')}<span>필요한 기능을 바로 선택하세요.</span></div>
    <section class="home-section delivery" aria-label="배달위험 알림">
      <div class="home-section-title">배달위험 알림</div>
      <div class="home-grid">
        <button class="home-tile" onclick="sfCall()"><span class="tile-icon">☎</span>관제실 전화</button>
        <button class="home-tile" onclick="sfVoiceScreen()"><span class="tile-icon">🎙</span>음성신고</button>
      </div>
    </section>
    <section class="home-section reporting" aria-label="신고하기">
      <div class="home-section-title">신고하기</div>
      <div class="home-grid">
        <button class="home-tile" onclick="startQuickReport()"><span class="tile-icon">▣</span>안심신고</button>
        <button class="home-tile" onclick="pickCat('welfare')"><span class="tile-icon">♡</span>복지신고</button>
      </div>
    </section>
    <section class="home-section returning" aria-label="업무종료 보고">
      <div class="home-section-title">업무종료 보고</div>
      <div class="home-grid">
        <button class="home-tile" onclick="openReturnReport('body')"><span class="tile-icon">♡</span>건강 이상</button>
        <button class="home-tile" onclick="openReturnReport('equipment')"><span class="tile-icon">⚙</span>장비 이상</button>
      </div>
    </section>
    <button class="history-link" onclick="showReportHistory()">내 신고내역 · 처리현황 <span>›</span></button>
    <div class="home-emergency-note">급박한 생명·신체 위험은 119 또는 112에 먼저 신고하세요.</div>`;
}
async function showReportHistory(){
  let mine=[];
  try{ mine=(await api('/api/reports')).reports||[]; }catch(e){ toast('신고내역을 불러오지 못했습니다'); }
  const hist = mine.length? mine.slice(0,8).map(r=>{
      const unclassified = r.type===null;
      const closed = ['cancelled','done','noaction'].includes(r.status); // 이미 종결된 건은 분류상태 문구 대신 종결상태를 우선 표시
      const catInfo = unclassified ? {color:'#9AA4AE', label: closed?'취소/종결':'분류 중'} : CATS[r.type];
      let itemLabel;
      if(!unclassified) itemLabel = r.item;
      else if(closed) itemLabel = '취소된 신고';
      else if(r.aiMode==='invalid') itemLabel = '⚠️ 확인 필요 (AI가 위험사진 아님으로 판단)';
      else if(r.aiMode==='error') itemLabel = '⚠️ 분류 실패 (직접 확인 필요)';
      else itemLabel = '🔍 AI 분류 대기 중…';
      const merged = r.status==='cancelled' && r.mergedInto && r.mergedIntoStatus;
      const pillLabel = merged ? '병합됨 · '+STATUS[r.mergedIntoStatus][0] : STATUS[r.status][0];
      const pillColor = merged ? STATUS[r.mergedIntoStatus][1] : STATUS[r.status][1];
      return `<div class="mrow clickable" onclick="viewReportDetail('${r.id}')">
        <span class="tag" style="background:${catInfo.color};padding:2px 8px;font-size:10px">${catInfo.label}</span>
        <span class="mi">${itemLabel}</span>
        <span class="pill" style="background:${pillColor}">${pillLabel}</span>
        <span class="row-arrow">›</span></div>`;
    }).join('')
    : `<div class="mine-empty">아직 접수한 신고가 없습니다.</div>`;
  $('cw').innerHTML=`<div class="backrow"><button class="back" onclick="home()">‹ 홈</button></div>
    <div class="h" style="font-size:19px">내 신고내역 · 처리현황</div><div class="mine">${hist}</div>`;
}
function installBanner(){
  const standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  if(standalone || localStorage.getItem('cv_install_dismissed')) return '';
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const tip = isIOS ? '하단 공유 버튼 → "홈 화면에 추가"를 누르세요' : '오른쪽 위 메뉴(⋮) → "앱 설치" 또는 "홈 화면에 추가"를 누르세요';
  return `<div class="install-banner">
    <div class="ib-text"><b>📲 홈 화면에 추가하면 앱처럼 바로 실행돼요</b><br>${tip}</div>
    <button class="ib-close" onclick="dismissInstallBanner()">✕</button>
  </div>`;
}
function dismissInstallBanner(){
  localStorage.setItem('cv_install_dismissed','1');
  const b=document.querySelector('.install-banner'); if(b) b.remove();
}
function pickCat(cat){ cur.cat=cat; if(cat==='welfare') return welfareForm();
  const c=CATS[cat];
  $('cw').innerHTML=`<div class="backrow"><button class="back" onclick="home()">‹ 뒤로</button><span class="tag" style="background:${c.color}">${c.label} 위험</span></div>
    <div class="h" style="font-size:17px">어떤 상황인가요?</div>
    <div class="subgrid">${c.items.map((it,i)=>`<button class="sub ${i===c.items.length-1?'etc':''}" onclick="pickItem('${it[1]}')"><span class="si">${it[0]}</span><span class="sl">${it[1]}${it[2]?`<br><small style="font-weight:600;color:var(--ink-2);font-size:10.5px">${it[2]}</small>`:''}</span></button>`).join('')}</div>`;
}



/* ===== 안전·환경 상세 ===== */
let map=null,marker=null,useKakao=false,kGeo=null;
function startQuickReport(){
  cur={cat:null,item:null,type:null,lat:null,lng:null,addr:'',photoBase64:null,memo:'',carrierUrgent:false,editId:null};
  ensureKakao(); // 카카오 미리 로드 시작(주소 변환용)
  $('cw').innerHTML=`<div class="backrow"><button class="back" onclick="home()">‹ 뒤로</button></div>
    <div class="h" style="font-size:18px">사진을 찍으면 위치까지<br>자동으로 접수됩니다</div>
    <div style="font-size:12.5px;color:var(--ink-2);margin:-6px 0 16px">분야는 AI가 자동으로 분류해요. 잘못 분류되면 나중에 직접 고칠 수 있어요.<br>※ 갤러리 사진은 촬영 당시 위치와 다를 수 있어 위치를 직접 선택해요.<br>📷 HTTPS 암호화 전송 · 사진은 서명형 만료 URL로만 접근 가능합니다.</div>
    <button class="urgent-toggle" id="urgentBtn" onclick="toggleUrgent()">🚨 지금 위험한 상황이에요 (즉시 조치 필요)</button>
    <input type="file" accept="image/*" capture="environment" class="hidden" id="cam" onchange="onQuickPhoto(event,true)">
    <input type="file" accept="image/*" class="hidden" id="camGallery" onchange="onQuickPhoto(event,false)">
    <div class="photo-btns" style="margin-top:10px">
      <button class="photo-btn" onclick="document.getElementById('cam').click()">📸 사진 촬영<br><small style="font-weight:600;opacity:.75">위치 자동</small></button>
      <button class="photo-btn" onclick="document.getElementById('camGallery').click()">🖼 갤러리에서 선택<br><small style="font-weight:600;opacity:.75">위치 직접 선택</small></button>
    </div>`;
}
function toggleUrgent(){
  cur.carrierUrgent=!cur.carrierUrgent;
  const b=$('urgentBtn');
  if(cur.carrierUrgent){ b.classList.add('on'); b.textContent='🚨 긴급으로 표시됨 (다시 누르면 해제)'; }
  else{ b.classList.remove('on'); b.textContent='🚨 지금 위험한 상황이에요 (즉시 조치 필요)'; }
}
async function onQuickPhoto(e,fromCamera){
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  $('cw').innerHTML=`<div style="text-align:center;padding:42px 12px"><div class="spin"></div><div style="font-weight:800;margin-top:15px">사진 업로드 중…</div></div>`;
  try{
    cur.photoBase64=await fileToBase64(f);
    cur.photoPrivacy='none';
    fromCamera ? showAutoLocating() : showManualLocationPicker();
  }catch(err){
    console.error(err); toast('사진 처리 오류 · 다시 선택해 주세요'); startQuickReport();
  }
}
function showAutoLocating(){
  $('cw').innerHTML=`<div style="text-align:center;padding:36px 10px">
    <img src="${cur.photoBase64}" style="width:100%;max-width:300px;border-radius:14px;border:1px solid var(--line);margin-bottom:22px">
    <div class="spin"></div>
    <div style="font-weight:800;margin-top:14px;font-size:15px">위치 확인 중…</div>
    <div style="font-size:12px;color:var(--ink-2);margin-top:4px">잠시만 기다려 주세요</div>
  </div>`;
  if(!navigator.geolocation){ return quickSubmit(34.6816,126.9072); }
  navigator.geolocation.getCurrentPosition(
    p=>quickSubmit(p.coords.latitude,p.coords.longitude),
    ()=>quickSubmit(34.6816,126.9072),
    {enableHighAccuracy:true,timeout:8000});
}
/* 갤러리 선택 시: 촬영 당시 위치를 알 수 없으므로 지도/주소로 직접 지정 (기존 위치선택 UI 재사용) */
function showManualLocationPicker(){
  $('cw').innerHTML=`<div class="backrow"><button class="back" onclick="startQuickReport()">‹ 뒤로</button></div>
    <div class="card"><div class="pad" style="padding-top:13px">
      <img src="${cur.photoBase64}" style="width:100%;border-radius:10px;border:1px solid var(--line)">
    </div></div>
    <div class="card"><div class="card-h">📍 이 사진이 찍힌 위치</div><div class="pad">
      <div class="locmodes">
        <button class="lmode" onclick="locate()">📍 내 위치</button>
        <button class="lmode" onclick="openMapPicker()">🗺️ 지도에서 찍기</button>
        <button class="lmode" onclick="openAddrInput()">✍️ 주소 입력</button>
      </div>
      <div id="addrBox" style="display:none;margin-top:11px">
        <input class="addr-in" id="addrTyped" placeholder="예: 장흥읍 흥성로 45" onkeydown="if(event.key==='Enter')searchAddr()">
        <button class="addr-go" onclick="searchAddr()">확인</button>
        <div class="addr-msg" id="addrMsg"></div>
      </div>
      <div id="cmap"></div>
      <input class="addr-in" id="addr" style="margin-top:11px;display:none" placeholder="확정된 도로명주소 (수정 가능)" oninput="cur.addr=this.value">
      <div class="coord" id="coord"></div>
      <div class="pin-hint" id="pinHint">📌 위 버튼 중 하나로 위치를 먼저 선택해 주세요</div>
    </div></div>
    <button class="save" id="saveBtn" onclick="submitWithManualLocation()">위치 확정하고 접수 ›</button>
    <div class="save-sub">분야는 AI가 자동으로 분류해요</div>`;
}
async function submitWithManualLocation(){
  if(!cur.lat){ toast('먼저 위치를 선택해 주세요'); return; }
  const btn=$('saveBtn'); btn.disabled=true; btn.textContent='접수 중…';
  cur.addr=$('addr').value||cur.addr;
  try{
    await api('/api/reports',{method:'POST',body:JSON.stringify({
      region:cur.region||me.region, addr:cur.addr||'', lat:cur.lat, lng:cur.lng,
      memo:cur.memo||'', photoBase64:cur.photoBase64, photoPrivacy:cur.photoPrivacy||'none', carrierUrgent:!!cur.carrierUrgent })});
    doneScreen();
  }catch(e){ btn.disabled=false; btn.textContent='위치 확정하고 접수 ›'; toast('전송 실패 · 다시 시도해 주세요'); }
}
async function quickSubmit(lat,lng){
  cur.lat=lat; cur.lng=lng;
  // 주소는 가능하면 채우되(카카오/OSM), 실패해도 좌표만으로 제출 진행
  try{
    if(KAKAO_KEY&&kakaoReady&&kakao.maps.services){
      const geo=new kakao.maps.services.Geocoder();
      await new Promise(res=>{
        geo.coord2Address(lng,lat,(r,st)=>{
          if(st===kakao.maps.services.Status.OK&&r[0]){
            const road=r[0].road_address, jibun=r[0].address;
            cur.addr=(road&&road.address_name)||(jibun&&jibun.address_name)||'';
            cur.region=regionFromKakaoAddr(jibun)||regionFromKakaoAddr(road)||me.region;
          }
          res();
        });
      });
    } else {
      const resp=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=ko`);
      const d=await resp.json(); const a=d.address||{};
      cur.region=a.city||a.county||a.town||me.region;
      cur.addr=[a.province,a.city||a.county||a.town,a.suburb||a.city_district,a.road,a.house_number].filter(Boolean).join(' ');
    }
  }catch(e){ /* 주소 실패해도 좌표는 있으니 계속 진행 */ }

  try{
    await api('/api/reports',{method:'POST',body:JSON.stringify({
      region:cur.region||me.region, addr:cur.addr||'', lat:cur.lat, lng:cur.lng,
      memo:cur.memo||'', photoBase64:cur.photoBase64, photoPrivacy:cur.photoPrivacy||'none', carrierUrgent:!!cur.carrierUrgent })});
    doneScreen();
  }catch(e){ toast('전송 실패 · 다시 시도해 주세요'); home(); }
}

let kakaoLoading=false, kakaoCbs=[];
function ensureKakao(cb){
  if(kakaoReady) return cb && cb();
  if(!KAKAO_KEY) return cb && cb(); // 키 없으면 Leaflet 폴백
  if(cb) kakaoCbs.push(cb);
  if(kakaoLoading) return;
  kakaoLoading=true;
  const s=document.createElement('script');
  s.src=`//dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_KEY}&libraries=services&autoload=false`;
  s.onload=()=>kakao.maps.load(()=>{ kakaoReady=true; kakaoLoading=false; const q=kakaoCbs.slice(); kakaoCbs=[]; q.forEach(f=>f()); });
  s.onerror=()=>{ kakaoLoading=false; const q=kakaoCbs.slice(); kakaoCbs=[]; q.forEach(f=>f()); };
  document.head.appendChild(s);
}
function setLocReady(){
  const msg=$('addrMsg');
  if(msg){ msg.textContent=''; msg.style.color=''; }
  $('addr').style.display='block';
  $('pinHint').textContent='📌 위치가 다르면 지도를 눌러 핀을 옮기거나 주소를 직접 수정하세요';
}
function locate(){
  const done=(la,ln)=>{ cur.lat=la;cur.lng=ln;
    $('coord').textContent=`좌표 ${la.toFixed(6)}, ${ln.toFixed(6)}`;
    $('addrBox').style.display='none';
    setLocReady();
    ensureKakao(()=>{ (KAKAO_KEY&&kakaoReady)?kakaoMap(la,ln):leafletMap(la,ln); revGeo(la,ln); });
  };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(p=>done(p.coords.latitude,p.coords.longitude),
      ()=>done(34.6816,126.9072),{enableHighAccuracy:true,timeout:8000});
  } else done(34.6816,126.9072);
}

function applySearchedLocation(la,ln,shown,region,msg){
  cur.lat=la; cur.lng=ln;
  cur.region=region||(me&&me.region);
  $('coord').textContent=`좌표 ${la.toFixed(6)}, ${ln.toFixed(6)}`;
  setLocReady();
  kakaoMap(la,ln);
  $('addr').value=shown;
  cur.addr=shown;
  msg.textContent='✓ 주소를 찾았습니다.';
  msg.style.color='#0B8A5B';
  setTimeout(()=>{ if(msg && msg.textContent.startsWith('✓')) msg.textContent=''; },1800);
}

function searchAddr(){
  const q=($('addrTyped')&&$('addrTyped').value||'').trim();
  const msg=$('addrMsg');
  if(!q){ msg.textContent='주소를 입력해 주세요.'; msg.style.color='#C70026'; return; }

  msg.textContent='주소 확인 중…';
  msg.style.color='#3A4550';

  ensureKakao(()=>{
    if(!(KAKAO_KEY&&kakaoReady&&window.kakao&&kakao.maps&&kakao.maps.services)){
      msg.textContent='지도 서비스를 준비 중입니다. 잠시 후 다시 눌러 주세요.';
      msg.style.color='#3A4550';
      return;
    }

    const geo=new kakao.maps.services.Geocoder();

    // 1차: 정확한 도로명/지번 주소 검색
    geo.addressSearch(q,(res,st)=>{
      if(st===kakao.maps.services.Status.OK && res[0]){
        const la=parseFloat(res[0].y), ln=parseFloat(res[0].x);
        const r=res[0].road_address, j=res[0].address;
        const shown=(r&&r.address_name)||(j&&j.address_name)||q;
        const region=regionFromKakaoAddr(j)||regionFromKakaoAddr(r)||(me&&me.region);
        applySearchedLocation(la,ln,shown,region,msg);
        return;
      }

      // 2차: 읍·면·건물명·불완전한 주소도 찾도록 키워드 검색
      const places=new kakao.maps.services.Places();
      places.keywordSearch(q,(data,status)=>{
        if(status===kakao.maps.services.Status.OK && data && data[0]){
          const p=data[0];
          const la=parseFloat(p.y), ln=parseFloat(p.x);
          const shown=p.road_address_name||p.address_name||p.place_name||q;
          // 키워드 검색 결과엔 시/구 정보가 없으므로, 실제 좌표로 역지오코딩해서
          // 지역을 다시 판정한다 (그냥 me.region으로 넘기면 집배원 소속 지역으로
          // 잘못 잡혀서, 예를 들어 광주에서 신고해도 장흥군으로 접수될 수 있음).
          geo.coord2Address(ln,la,(cres,cst)=>{
            let region=(me&&me.region);
            if(cst===kakao.maps.services.Status.OK && cres[0]){
              const cr=cres[0].road_address, cj=cres[0].address;
              region=regionFromKakaoAddr(cj)||regionFromKakaoAddr(cr)||region;
            }
            applySearchedLocation(la,ln,shown,region,msg);
          });
        } else {
          msg.textContent='주소를 찾지 못했습니다. 도로명과 건물번호를 확인해 주세요.';
          msg.style.color='#C70026';
        }
      });
    });
  });
}
function resetMapEl(){
  const el=$('cmap'); if(!el) return null;
  if(map){
    try{ if(useKakao){ map=null; } else { map.remove(); map=null; } }catch(e){ map=null; }
  }
  el.innerHTML=''; // Leaflet의 _leaflet_id 등 잔재 제거
  return el;
}
function kakaoMap(la,ln){
  useKakao=true; const el=resetMapEl(); el.style.display='block';
  const c=new kakao.maps.LatLng(la,ln);
  map=new kakao.maps.Map(el,{center:c,level:2});
  marker=new kakao.maps.Marker({position:c,draggable:true}); marker.setMap(map);
  kGeo=new kakao.maps.services.Geocoder();
  kakao.maps.event.addListener(marker,'dragend',()=>{const p=marker.getPosition();cur.lat=p.getLat();cur.lng=p.getLng();setCoord();revGeo(p.getLat(),p.getLng());});
  kakao.maps.event.addListener(map,'click',e=>{const ll=e.latLng;marker.setPosition(ll);cur.lat=ll.getLat();cur.lng=ll.getLng();setCoord();revGeo(ll.getLat(),ll.getLng());});
}
function leafletMap(la,ln){
  useKakao=false; const el=resetMapEl(); el.style.display='block';
  if(typeof L==='undefined'){ el.innerHTML='<div style="padding:20px;color:#888;font-size:12px;text-align:center">지도 로드 실패</div>'; return; }
  map=L.map('cmap',{zoomControl:false,attributionControl:false}).setView([la,ln],17);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  marker=L.marker([la,ln],{draggable:true}).addTo(map);
  marker.on('dragend',()=>{const p=marker.getLatLng();cur.lat=p.lat;cur.lng=p.lng;setCoord();revGeo(p.lat,p.lng);});
  map.on('click',e=>{marker.setLatLng(e.latlng);cur.lat=e.latlng.lat;cur.lng=e.latlng.lng;setCoord();revGeo(e.latlng.lat,e.latlng.lng);});
  setTimeout(()=>map.invalidateSize(),60);
}
function setCoord(){ $('coord').textContent=`좌표 ${cur.lat.toFixed(6)}, ${cur.lng.toFixed(6)}`; }
function revGeo(la,ln){
  const inp=$('addr'); inp.value='주소 변환 중…';
  if(KAKAO_KEY&&kakaoReady&&kGeo){
    kGeo.coord2Address(ln,la,(res,st)=>{
      if(st===kakao.maps.services.Status.OK&&res[0]){
        const r=res[0].road_address,j=res[0].address;
        inp.value=(r&&r.address_name)||(j&&j.address_name)||'주소 확인 불가';
        cur.region=regionFromKakaoAddr(j)||regionFromKakaoAddr(r)||me.region;
      } else inp.value='주소 확인 불가';
      cur.addr=inp.value;
    });
  } else {
    fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${la}&lon=${ln}&accept-language=ko`)
      .then(r=>r.json()).then(d=>{const a=d.address||{};
        cur.region=a.city||a.county||a.town||me.region;
        const parts=[a.province,a.city||a.county||a.town,a.suburb||a.city_district,a.road,a.house_number].filter(Boolean);
        inp.value=parts.length?parts.join(' '):(d.display_name||'주소 확인');
        cur.addr=inp.value;
      }).catch(()=>{inp.value='전남 장흥군 장흥읍 (예시)';cur.addr=inp.value;cur.region=me.region;});
  }
}

function fmtDate(iso){ if(!iso) return '-'; const d=new Date(iso);
  return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}. ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
async function viewReportDetail(id){
  let mine=[];
  try{ mine=(await api('/api/reports')).reports; }catch(e){ toast('불러오기 실패'); return; }
  const r=mine.find(x=>x.id===id);
  if(!r){ toast('신고를 찾을 수 없습니다'); return; }
  const LOCKED=['done','noaction','cancelled'];
  const unclassified = r.type===null;
  const pending = unclassified && r.aiMode===null; // 아직 AI 처리 중 (수정 막아야 - 충돌 방지)
  const editable = !LOCKED.includes(r.status) && !pending;
  const cancelable = !LOCKED.includes(r.status);
  const c = unclassified ? {color:'#9AA4AE'} : CATS[r.type];
  const merged = r.status==='cancelled' && r.mergedInto && r.mergedIntoStatus;
  const st = merged ? ['병합됨 · '+STATUS[r.mergedIntoStatus][0], STATUS[r.mergedIntoStatus][1]] : STATUS[r.status];

  const row=(k,v)=>`<div class="d-row"><span class="d-k">${k}</span><span class="d-v">${v}</span></div>`;
  let body='';
  if(unclassified){
    const closed = r.status==='cancelled';
    const waitMsg = closed ? '🗑 이 신고는 취소·종결 처리되었습니다.'
      : r.aiMode==='error' ? '⚠️ AI 분류에 실패했습니다. 아래 「수정하기」에서 직접 분류를 지정해 주세요.'
      : r.aiMode==='invalid' ? '⚠️ AI가 안전·환경 위험 사진으로 인식하지 못했어요. 사진이 잘못됐다면 「수정하기」에서 다시 찍거나, 실제 신고가 맞다면 분류를 직접 지정해 주세요.'
      : '🔍 AI가 사진을 보고 분류 중이에요. 몇 초 후 자동으로 반영돼요.';
    body+=row('분야', `<span class="tag" style="background:#9AA4AE">${closed?'취소됨':r.aiMode==='invalid'?'확인 필요':'분류 중'}</span> ${waitMsg}`);
  } else {
    body+=row('분야', `<span class="tag" style="background:${c.color}">${c.label}</span> ${r.item}${r.subtype?' · '+r.subtype:''}`);
  }
  body+=row('상태', `<span class="pill" style="background:${st[1]}">${st[0]}</span>`);
  body+=row('접수 시각', fmtDate(r.createdAt));
  if(r.type==='welfare' && r.welfare){ const w=r.welfare;
    body+=row('대상', `${w.name} · ${w.age} · ${w.household}`);
    body+=row('조치 요청', w.action);
    body+=row('사유', w.reason);
    if(r.addr) body+=row('주소', r.addr);
  } else {
    if(r.addr) body+=row('위치', r.addr);
    if(r.memo) body+=row('설명', r.memo);
  }
  if(r.reason) body+=row('처리 메모', r.reason);
  if(r.aiMode==='manual') body+=row('분류 방식', '담당자가 사진을 보고 직접 지정함');
  if(r.edited) body+=row('수정 이력', `접수 후 내용 수정함${r.editedAt?' · '+fmtDate(r.editedAt):''}`);
  if(r.status==='cancelled'){
    if(merged){
      body+=row('처리 안내', `🔗 다른 집배원이 먼저 접수한 동일 사안 신고와 병합되어 함께 처리됩니다.<br>현재 상태: <b>${STATUS[r.mergedIntoStatus][0]}</b>${r.mergedIntoReason?' · '+r.mergedIntoReason:''}`);
    } else {
      const byLabel = r.cancelledBy==='control' ? '관제실이 취소·종결 처리함'
                    : r.cancelledBy==='dept'    ? '담당 부서가 취소·종결 처리함'
                    : '집배원 본인이 취소함';
      body+=row('취소 이력', `${byLabel}${r.cancelledAt?' · '+fmtDate(r.cancelledAt):''}`);
    }
  }
  const photo = r.photoUrl?`<img src="${r.photoUrl}" style="width:100%;border-radius:10px;margin-top:12px;border:1px solid var(--line)">`:'';

  const lockedReason = merged ? '병합 처리된 신고' : r.status==='cancelled' ? '취소된 신고' : '처리 완료된 신고';
  const editFn = r.type==='welfare' ? 'editWelfareReport' : 'editReport';
  const editBtn = pending ? '' :
    editable ? `<button class="save" onclick="${editFn}('${r.id}')">✏️ 수정하기 ›</button>`
             : `<button class="save disabled" disabled>✏️ 수정 (${lockedReason}이라 불가)</button>`;
  const cancelBtn = cancelable
    ? `<button class="cancel-report-btn" onclick="cancelReport('${r.id}')">🗑 이 신고 취소하기</button>`
    : `<button class="cancel-report-btn disabled" disabled>🗑 이미 ${merged ? '병합 처리됨' : lockedReason === '취소된 신고' ? '취소됨' : '처리 완료됨'}</button>`;

  $('cw').innerHTML=`<div class="backrow"><button class="back" onclick="home()">‹ 홈으로</button></div>
    <div class="card"><div class="pad" style="padding-top:13px">${body}</div></div>
    ${photo}
    ${editBtn}
    ${cancelBtn}`;
}

/* 최신 폰 갤러리 사진은 원본이 수 MB~십수 MB라 그대로 base64로 보내면 서버 요청
 * 용량 제한(10MB)을 넘어 전송 실패가 난다. 캔버스로 축소·재압축해서 보낸다. */
function fileToBase64(file){
  const MAX_DIM=1600, QUALITY=0.82;
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>MAX_DIM||h>MAX_DIM){ const scale=MAX_DIM/Math.max(w,h); w=Math.round(w*scale); h=Math.round(h*scale); }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        res(canvas.toDataURL('image/jpeg',QUALITY));
      };
      img.onerror=()=>rej(new Error('이미지를 읽을 수 없습니다.'));
      img.src=e.target.result;
    };
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

/* =====================================================================
 * 집배원 안전 모드 (PDA)
 *  - 관제실 전화 / 음성 위험신고 / 업무종료 이상유무 보고
 *  - 안전 알림 수신: 긴급=화면 고정+긴 진동+경고음+음성, 확인 필수 / 주의·전달말씀=진동+상단 흐르는 글자
 * 구역 명부에 없는 계정(예: 영업과 직원)은 이 기능이 보이지 않는다.
 * ===================================================================== */
let SF=null, sfWs=null, sfPoll=null, sfRemind=null, sfActx=null, sfShiftPick=null;
const SF_LV={urgent:['긴급','var(--urgent)'],caution:['주의','var(--caution)'],notice:['전달말씀','var(--notice)']};
const SF_HZ={pending:['관제실 확인 중','#7C8794'],dispatched:['알림 전파됨','#0B8A5B'],closed:['종결','#9AA4AE']};
const SF_BELL='<svg class="bell" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>';
const sfEsc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sfTime=iso=>{const d=new Date(iso);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
function sfSeen(){ try{return new Set(JSON.parse(sessionStorage.getItem('sf_seen')||'[]'));}catch(e){return new Set();} }
function sfMarkSeen(ids){ const s=sfSeen(); ids.forEach(i=>s.add(i)); sessionStorage.setItem('sf_seen',JSON.stringify([...s].slice(-200))); }

/* 소리·진동 — 브라우저는 사용자가 한 번 화면을 눌러야 소리를 허용하므로 로그인/첫 터치 때 준비 */
function sfUnlockAudio(){ try{ sfActx=sfActx||new (window.AudioContext||window.webkitAudioContext)(); if(sfActx.state==='suspended') sfActx.resume(); }catch(e){} }
document.addEventListener('pointerdown',sfUnlockAudio,{passive:true});
function sfBeep(times){
  if(!sfActx) return;
  try{ const t0=sfActx.currentTime;
    for(let i=0;i<times;i++){ const o=sfActx.createOscillator(), g=sfActx.createGain();
      o.type='square'; o.frequency.value=i%2?740:988; const st=t0+i*0.2;
      g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.22,st+0.02); g.gain.exponentialRampToValueAtTime(0.0001,st+0.16);
      o.connect(g).connect(sfActx.destination); o.start(st); o.stop(st+0.18); }
  }catch(e){}
}
function sfRing(level,text){
  const pat = level==='urgent' ? [1000,250,1000,250,1000,250,1500] : level==='caution' ? [400,150,400] : [250];
  try{ navigator.vibrate && navigator.vibrate(pat); }catch(e){}
  sfBeep(level==='urgent'?4:level==='caution'?2:1);
  if(level==='urgent' && text && 'speechSynthesis' in window){
    try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance('긴급 안전 알림. '+text); u.lang='ko-KR'; u.rate=1; speechSynthesis.speak(u); }catch(e){}
  }
}

    sfWs.onclose=()=>{ if(token) setTimeout(open,3000); };
  };
  open();
  sfPoll=setInterval(sfLoad,60000);            // 연결이 끊겨도 1분마다 확인
  sfRemind=setInterval(()=>{                    // 미확인 긴급 알림은 90초마다 재알림
    const p=sfPendingUrgent(); if(p.length) sfRing('urgent',p[0].text);
  },90000);
}

async function sfLoad(){

const sfPendingUrgent=()=>(SF?.alerts||[]).filter(a=>a.level==='urgent'&&!a.acked).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));

function sfHandleAlerts(){
  const seen=sfSeen(), fresh=SF.alerts.filter(a=>!seen.has(a.id));
  const urg=sfPendingUrgent();
  if(urg.length) sfShowOverlay(urg);
  else $('sfOverlay').classList.remove('on');
  const newUrgent=fresh.find(a=>a.level==='urgent'&&!a.acked);
  if(newUrgent) sfRing('urgent',newUrgent.text);
  else { const n=fresh.filter(a=>a.level!=='urgent').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))[0];
    if(n){ sfRing(n.level); sfShowBanner(n); } }
  sfMarkSeen(fresh.map(a=>a.id));
}

  $('sfOverlay').classList.add('on');
}
async function sfAck(){
  const b=$('sfAckBtn'), id=b.dataset.id; if(!id) return; b.disabled=true;
  try{ await api('/api/safety/alerts/'+id+'/ack',{method:'POST',body:'{}'});

    try{ navigator.vibrate&&navigator.vibrate(0); speechSynthesis&&speechSynthesis.cancel(); }catch(e){}
    const rest=sfPendingUrgent(); if(rest.length) sfShowOverlay(rest); else $('sfOverlay').classList.remove('on');
    sfRenderTicker();

function sfRenderTicker(){
  const t=$('sfTicker'); const list=(SF?.alerts||[]).filter(a=>!(a.level==='urgent'&&!a.acked)).slice(0,5);
  if(!list.length){ t.classList.add('hidden'); return; }

  const len=list.reduce((n,a)=>n+a.text.length,0);
  t.innerHTML=`${SF_BELL}<div class="track"><div class="run" style="--dur:${Math.max(12,Math.round(len/4))}s">${items}</div></div>`;

function sfOpenAlerts(){

  $('sfSheet').innerHTML=`<div class="h" style="font-size:17px">오늘의 안전 알림</div>`+
    (list.length?list.map(a=>`<div class="sf-al" style="border-left-color:${SF_LV[a.level][1]}"><div class="m">${SF_LV[a.level][0]} · ${sfTime(a.createdAt)} · ${sfEsc(a.sender)}${a.level==='urgent'?(a.acked?' · 확인함':' · 미확인'):''}</div><div class="t">${sfEsc(a.text)}</div></div>`).join('')
      :`<div class="mine-empty">오늘 받은 알림이 없습니다.</div>`)+
    `<button class="save" style="margin-top:10px" onclick="$('sfModal').classList.remove('on')">닫기</button>`;
  $('sfModal').classList.add('on');
}

/* ---------- 홈 화면 안전 카드 ---------- */
function sfShiftHomeHtml(){
  const st=SF.shift?.status||null, cur=sfShiftPick||st;
  const statusText={ok:'이상 없음',pain:'경미한 통증',injury:'부상 있음'};
  return `<div class="shift-label">건강 상태 <small>기존 보고 방식</small></div>
    <div class="sf-shift"><div class="row3">
      <button class="opt ok ${cur==='ok'?'on':''}" onclick="sfShift('ok')">이상 없음</button>
      <button class="opt pain ${cur==='pain'?'on':''}" onclick="sfShift('pain')">경미한 통증</button>
      <button class="opt injury ${cur==='injury'?'on':''}" onclick="sfShift('injury')">부상 있음</button>
    </div></div>
    ${sfShiftPick&&sfShiftPick!=='ok'?`<input class="f-in" id="sfShiftMemo" style="margin-top:9px" placeholder="증상을 간단히 적어주세요" maxlength="100"><button class="save" style="margin-top:8px;padding:12px" onclick="sfShiftSend()">보고하기</button>`:''}
    <div class="sf-note">${st?'오늘 보고: '+statusText[st]+' · '+sfTime(SF.shift.at):'업무 종료 후 상태를 선택하세요.'}</div>
    <div class="shift-device-note">장비 상태 점검은 별도 저장 기능 연결 후 추가됩니다.</div>`;
}
function sfBoxHtml(){ return (SF&&SF.role==='carrier')?`<div class="sf-box" id="sfBox">${sfBoxInner()}</div>`:'<div id="sfBox"></div>'; }
function sfRenderBox(){ /* 업무종료 보고는 귀국보고 전용 화면에서 신체·장비를 함께 저장합니다. */ }
function sfBoxInner(){
  const st=SF.shift?.status||null, cur=sfShiftPick||st;
  const mine=(SF.myHazards||[]).slice(0,3).map(h=>`<div>🎙 ${sfTime(h.createdAt)} ${sfEsc((h.transcript||'음성 신고').slice(0,22))}<b style="color:${SF_HZ[h.status][1]}">${SF_HZ[h.status][0]}</b></div>`).join('');
  const shiftTxt = st ? `오늘 보고: <b>${({ok:'이상없음',pain:'경미한 통증',injury:'부상 있음'})[st]}</b>${SF.shift.source==='control'?' (관제 확인)':''} · ${sfTime(SF.shift.at)} · 다시 누르면 수정돼요` : '배달을 마치면 눌러주세요';
  return `<div class="sf-h">🦺 집배원 안전 · ${sfEsc(SF.me.zoneName)}</div>
    <div class="sf-main">
      <button class="sf-btn sf-call" onclick="sfCall()"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1Z"/></svg>관제실 전화<small>사고·급한 상황</small></button>
      <button class="sf-btn sf-voice" onclick="sfVoiceScreen()"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a6 6 0 0 1-12 0H4.5a7.5 7.5 0 0 0 6.75 7.46V22h1.5v-3.04a7.5 7.5 0 0 0 6.75-7.46H18Z"/></svg>음성신고<small>말 한마디로 신고</small></button>
    </div>
    ${mine?`<div class="sf-mine">${mine}</div>`:''}
    <div class="sf-shift">
      <div class="sf-h" style="margin-bottom:8px">업무종료 이상유무 보고</div>
      <div class="row3">
        <button class="opt ok ${cur==='ok'?'on':''}" onclick="sfShift('ok')">이상없음</button>
        <button class="opt pain ${cur==='pain'?'on':''}" onclick="sfShift('pain')">경미한 통증</button>
        <button class="opt injury ${cur==='injury'?'on':''}" onclick="sfShift('injury')">부상 있음</button>
      </div>
      ${sfShiftPick&&sfShiftPick!=='ok'?`<input class="f-in" id="sfShiftMemo" style="margin-top:8px" placeholder="아픈 곳 (예: 오른쪽 무릎) · 선택 입력" maxlength="100">
        <button class="save" style="margin-top:8px;padding:13px" onclick="sfShiftSend()">보고하기</button>`:''}
      <div class="sf-note">${shiftTxt}<br>보고 내용으로 불이익은 없습니다. 작은 통증도 기록해 두면 산재 확인 때 본인에게 도움이 됩니다.</div>
    </div>`;
}
async function sfShift(st){
  if(st==='ok'){ sfShiftPick=null; return sfShiftSend('ok'); }
  sfShiftPick=st; sfRenderBox(); setTimeout(()=>$('sfShiftMemo')&&$('sfShiftMemo').focus(),50);
}
async function sfShiftSend(forced){
  const status=forced||sfShiftPick; const memo=forced?'':(($('sfShiftMemo')||{}).value||'');
  try{ await api('/api/safety/shift',{method:'POST',body:JSON.stringify({status,memo})}); sfShiftPick=null; toast('보고 완료'); await sfLoad(); }
  catch(e){ toast(e.message||'보고 실패'); }
}

/* ---------- 관제실 전화: 전화 연결 + 통화 기록(누가·언제·어디서) 자동 전송 ---------- */
function sfGeo(timeout=3000){
  return new Promise(res=>{ if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),()=>res(null),{enableHighAccuracy:true,timeout,maximumAge:60000}); });
}
async function sfCall(){
  const num=SF.callNumber;
  const pos=await Promise.race([sfGeo(2500), new Promise(r=>setTimeout(()=>r(null),2600))]);
  api('/api/safety/calls',{method:'POST',body:JSON.stringify(pos||{})}).catch(()=>{});
  location.href='tel:'+num.replace(/[^0-9+]/g,'');
}

/* ---------- 음성 위험신고 ---------- */
let sfRec=null, sfChunks=[], sfTimer=null, sfSec=0, sfAudio=null, sfPhoto=null, sfLive='', sfSr=null, sfPos=null;
function sfVoiceScreen(){
  sfAudio=null; sfPhoto=null; sfLive=''; sfPos=null;
  sfGeo(8000).then(p=>{ sfPos=p; });
  $('cw').innerHTML=`<div class="backrow"><button class="back" onclick="sfCancelRec();home()">‹ 뒤로</button></div>
    <div class="h" style="font-size:18px">위험한 곳을 말로 알려주세요</div>
    <div style="font-size:12.5px;color:var(--ink-2);margin:-6px 0 12px">예) "관산 23번 국도 다리 앞 결빙으로 위험합니다"<br>위치는 자동으로 붙고, 관제실 확인 후 해당 구역에 알림이 나갑니다.<br>다치셨다면 녹음 말고 <b>관제실 전화</b>를 눌러주세요.</div>
    <div class="rec-wrap">
      <button class="rec-btn" id="sfRecBtn" onclick="sfToggleRec()"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a6 6 0 0 1-12 0H4.5a7.5 7.5 0 0 0 6.75 7.46V22h1.5v-3.04a7.5 7.5 0 0 0 6.75-7.46H18Z"/></svg><span id="sfRecLb">눌러서 녹음</span></button>
      <div class="rec-time" id="sfRecT">0:00 / 0:30</div>
      <div class="rec-live" id="sfRecLive"></div>
    </div>
    <div id="sfAfter"></div>`;
}
function sfPickMime(){
  const c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus','audio/ogg'];
  return (window.MediaRecorder&&MediaRecorder.isTypeSupported)?(c.find(t=>MediaRecorder.isTypeSupported(t))||''):'';
}
async function sfToggleRec(){
  if(sfRec&&sfRec.state==='recording'){ sfRec.stop(); return; }
  if(!navigator.mediaDevices||!window.MediaRecorder){ toast('이 기기는 녹음을 지원하지 않습니다'); return; }
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ toast('마이크 권한을 허용해 주세요'); return; }
  const mime=sfPickMime(); sfChunks=[]; sfAudio=null; $('sfAfter').innerHTML='';
  sfRec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
  sfRec.ondataavailable=e=>{ if(e.data&&e.data.size) sfChunks.push(e.data); };
  sfRec.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); clearInterval(sfTimer); try{sfSr&&sfSr.stop();}catch(e){}
    sfAudio=new Blob(sfChunks,{type:sfRec.mimeType||mime||'audio/webm'});
    $('sfRecBtn').classList.remove('on'); $('sfRecLb').textContent='다시 녹음'; sfAfterRec(); };
  sfRec.start(); sfSec=0; $('sfRecBtn').classList.add('on'); $('sfRecLb').textContent='눌러서 끝내기';
  sfTimer=setInterval(()=>{ sfSec++; $('sfRecT').textContent=`0:${String(sfSec).padStart(2,'0')} / 0:30`; if(sfSec>=30&&sfRec.state==='recording') sfRec.stop(); },1000);
  // 기기 음성인식이 되면 말하는 동안 글자를 미리 보여준다(서버 변환이 없을 때 대체용으로도 전송)
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; sfLive='';
  if(SR){ try{ sfSr=new SR(); sfSr.lang='ko-KR'; sfSr.interimResults=true; sfSr.continuous=true;
    sfSr.onresult=e=>{ let t=''; for(const r of e.results) t+=r[0].transcript; sfLive=t.trim(); $('sfRecLive').textContent=sfLive; };
    sfSr.onerror=()=>{}; sfSr.start(); }catch(e){} }
}
function sfCancelRec(){ try{ if(sfRec&&sfRec.state==='recording'){ sfRec.onstop=null; sfRec.stop(); } }catch(e){} clearInterval(sfTimer); try{sfSr&&sfSr.stop();}catch(e){} }
function sfAfterRec(){
  const url=URL.createObjectURL(sfAudio);
  $('sfAfter').innerHTML=`<div class="card"><div class="card-h">녹음 확인</div><div class="pad"><audio controls src="${url}" style="width:100%"></audio></div></div>
    <input type="file" accept="image/*" capture="environment" class="hidden" id="sfCam" onchange="sfOnPhoto(event)">
    <button class="photo-btn" id="sfPhotoBtn" onclick="$('sfCam').click()">📸 사진 추가 (필요할 때만)</button>
    <div id="sfPhotoPrev"></div>
    <button class="save" style="margin-top:12px" id="sfSend" onclick="sfSendVoice()">관제실로 보내기 ›</button>
    <div class="save-sub">관제실에서 확인한 뒤 해당 구역 집배원에게 알림이 나갑니다</div>`;
}
async function sfOnPhoto(e){
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  try{ sfPhoto=await fileToBase64(f); $('sfPhotoPrev').innerHTML=`<img class="thumb" style="margin:10px 0 0" src="${sfPhoto}" alt="첨부 사진">`; $('sfPhotoBtn').textContent='📸 사진 다시 찍기'; }
  catch(err){ toast('사진을 읽지 못했습니다'); }
}
function sfBlobToDataUrl(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); }); }
async function sfSendVoice(){
  const btn=$('sfSend'); btn.disabled=true; btn.textContent='보내는 중…';
  try{
    const audioBase64=await sfBlobToDataUrl(sfAudio);
    const body={audioBase64, clientText:sfLive, photoBase64:sfPhoto||undefined, ...(sfPos||{})};
    await api('/api/safety/voice',{method:'POST',body:JSON.stringify(body)});
    $('cw').innerHTML=`<div class="done"><div class="st">✓</div><div class="dt">관제실로 전송됐어요</div>
      <div class="ds">소통팀장이 확인한 뒤<br>해당 구역 집배원에게 알림이 나갑니다</div>
      <button class="save" style="max-width:260px;margin:22px auto 0" onclick="home()">처음으로 ›</button></div>`;
    sfLoad();
  }catch(e){ btn.disabled=false; btn.textContent='다시 보내기 ›'; toast(e.message||'전송 실패'); }
}

boot();
</script>

<script>
/* M-06: 건강·장비 이상 두 버튼은 동일한 귀국보고 기록으로 연결됩니다. */
(function(){
const escON=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let returnActive=false;
window.openReturnReport=async function(focus){
  returnActive=true;
  let layer=document.getElementById('on-return-layer');
  if(!layer){layer=document.createElement('div');layer.id='on-return-layer';layer.className='return-overlay';document.body.appendChild(layer);}
  layer.innerHTML='<div class="return-head"><button class="return-back" onclick="closeReturnReport()">‹ 뒤로</button>업무종료 보고</div><section id="on-return" aria-live="polite">불러오는 중…</section>';
  await onRefresh();
  const field=document.getElementById(focus==='equipment'?'return-equip-field':'return-body-field');
  if(field)field.scrollIntoView({block:'center',behavior:'smooth'});
};
window.closeReturnReport=function(){returnActive=false;document.getElementById('on-return-layer')?.remove();};
async function onRefresh(){
 if(!returnActive||!window.me)return;
 const el=document.getElementById('on-return');if(!el)return;
 try{const d=await api('/api/on/return/me');const r=d.report;
 el.innerHTML=`<div class="card" style="padding:16px"><h3 style="margin:0 0 8px">업무종료 보고 <small style="font-size:12px;color:#6a7a76">${escON(d.date)}</small></h3>
 <p style="font-size:12px;color:#65746c">배달을 마치고 귀국한 뒤 건강과 장비 상태를 확인해 주세요.</p>
 ${r?`<p style="font-size:12px;color:#28754d">✓ 오늘 보고 완료 · ${escON(new Date(r.at).toLocaleTimeString('ko-KR'))} (정정 가능)</p>`:''}
 <label style="margin:10px 0 2px"><input type="checkbox" id="on-returned" ${r?'checked':''}> 배달을 마치고 귀국했습니다</label>
 <div class="return-field" id="return-body-field"><p><b>건강 상태</b></p>
 <label><input type="radio" name="on-body" value="no" ${r&&!r.bodyIssue?'checked':''}> 이상 없음</label>
 <label><input type="radio" name="on-body" value="yes" ${r?.bodyIssue?'checked':''}> 이상 있음</label>
 <input class="f-in" id="on-body-detail" maxlength="300" placeholder="증상을 간단히 적어주세요" value="${escON(r?.bodyDetail||'')}" style="display:${r?.bodyIssue?'block':'none'}"></div>
 <div class="return-field" id="return-equip-field"><p><b>장비 상태</b></p>
 <label><input type="radio" name="on-equip" value="no" ${r&&!r.equipmentIssue?'checked':''}> 이상 없음</label>
 <label><input type="radio" name="on-equip" value="yes" ${r?.equipmentIssue?'checked':''}> 이상 있음</label>
 <input class="f-in" id="on-equip-detail" maxlength="300" placeholder="장비 종류와 이상 내용을 간단히 적어주세요" value="${escON(r?.equipmentDetail||'')}" style="display:${r?.equipmentIssue?'block':'none'}"></div>
 <button class="save" id="on-send" style="margin-top:16px;background:#317f60">${r?'보고 정정':'보고 제출'}</button><div id="on-result" role="status" style="font-size:12px;color:#ae3743;margin-top:8px"></div></div>`;
 el.querySelectorAll('input[type=radio]').forEach(x=>x.addEventListener('change',()=>{el.querySelector('#on-body-detail').style.display=el.querySelector('input[name=on-body]:checked')?.value==='yes'?'block':'none';el.querySelector('#on-equip-detail').style.display=el.querySelector('input[name=on-equip]:checked')?.value==='yes'?'block':'none';}));
 el.querySelector('#on-send').onclick=async()=>{const btn=el.querySelector('#on-send');const msg=el.querySelector('#on-result');
 const body=el.querySelector('input[name=on-body]:checked'),equip=el.querySelector('input[name=on-equip]:checked');
 if(!el.querySelector('#on-returned').checked){msg.textContent='귀국 확인을 선택해 주세요.';return;}
 if(!body||!equip){msg.textContent='건강·장비 상태를 각각 선택해 주세요.';return;}
 const bodyIssue=body.value==='yes',equipmentIssue=equip.value==='yes';
 if((bodyIssue&&!el.querySelector('#on-body-detail').value.trim())||(equipmentIssue&&!el.querySelector('#on-equip-detail').value.trim())){msg.textContent='이상이 있는 항목에 간단한 설명을 적어주세요.';return;}
 btn.disabled=true;try{await api('/api/on/return',{method:'POST',body:JSON.stringify({returned:true,bodyIssue,equipmentIssue,bodyDetail:el.querySelector('#on-body-detail').value,equipmentDetail:el.querySelector('#on-equip-detail').value})});toast('업무종료 보고가 접수되었습니다');closeReturnReport();}
 catch(e){msg.textContent=e.message||'전송 실패 · 다시 시도해 주세요';btn.disabled=false;}};
 }catch(e){el.textContent='업무종료 보고를 불러오지 못했습니다: '+e.message;}
}
async function noticesON(){if(!window.me)return;let host=document.getElementById('on-notices');if(!host){host=document.createElement('section');host.id='on-notices';document.getElementById('cw')?.prepend(host);}if(!host)return;try{const d=await api('/api/on/notices');host.innerHTML='<div class="card" style="padding:14px"><h3>📌 공지사항</h3>'+ (d.notices.length?d.notices.map(n=>`<div style="border-top:1px solid #ddd;padding:10px 0"><b>${escON(n.title)}</b><p>${escON(n.body)}</p>${n.acked?'✓ 확인함':`<button class="photo-btn" data-ack="${escON(n.id)}">공지 확인</button>`}</div>`).join(''):'새 공지사항이 없습니다.')+'</div>';host.querySelectorAll('[data-ack]').forEach(b=>b.onclick=async()=>{try{await api('/api/on/notices/'+encodeURIComponent(b.dataset.ack)+'/ack',{method:'POST'});await noticesON();}catch(e){alert(e.message);}});}catch(e){host.textContent='공지사항 조회 실패: '+e.message;}}
const old=window.home;window.home=async function(...args){const r=await old.apply(this,args);await onRefresh();await noticesON();return r;};
})();
</script>
