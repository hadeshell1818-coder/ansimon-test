name: 안심ON 안드로이드 앱(APK)

# Builds the installable Android app (a Trusted Web Activity around /report.html) and publishes it to the
# "android-latest" release so a phone can download and install it. Runs on demand or when android/ changes.
on:
  workflow_dispatch:
    inputs:
      url:
        description: '안심ON 운영 주소 (https://...)'
        required: false
        default: 'https://ansimon-test-production.up.railway.app'
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ github.event.inputs.url || 'https://ansimon-test-production.up.railway.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # A stable signing key (repository secrets) lets phones update the app in place and keeps the
      # Digital Asset Links fingerprint fixed. Without it a temporary key is made for this build only.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ansimon.jks"
            echo "ANSIMON_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_KIND=고정 서명 키(저장소 비밀값)" >> "$GITHUB_ENV"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/ansimon.jks" -storepass "$PASS" -keypass "$PASS" -alias ansimon \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AnsimOn Pilot, O=AnsimOn, C=KR"
            echo "::add-mask::$PASS"
            echo "ANSIMON_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_KIND=이번 빌드용 임시 서명 키(업데이트 시 기존 앱 삭제 후 설치 필요)" >> "$GITHUB_ENV"
          fi
          echo "ANSIMON_KEYSTORE=$RUNNER_TEMP/ansimon.jks" >> "$GITHUB_ENV"
          echo "ANSIMON_KEY_ALIAS=ansimon" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon -PansimonUrl="$SITE_URL" -PversionCode="${{ github.run_number }}"

      - name: Fingerprint and asset links
        run: |
          FP=$(keytool -list -v -keystore "$ANSIMON_KEYSTORE" -storepass "$ANSIMON_KEYSTORE_PASSWORD" -alias ansimon | sed -n 's/.*SHA256: //p' | head -1)
          echo "FINGERPRINT=$FP" >> "$GITHUB_ENV"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/ansimon.apk
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"kr.ansimon.app","sha256_cert_fingerprints":["%s"]}}]\n' "$FP" > out/assetlinks.json
          {
            echo "### 안심ON APK"
            echo "- 주소: $SITE_URL/report.html"
            echo "- 서명: $KEY_KIND"
            echo "- SHA-256 지문: \`$FP\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ansimon-apk
          path: out/

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(printf '휴대폰에서 아래 ansimon.apk를 눌러 내려받아 설치하세요(출처를 알 수 없는 앱 설치 허용 필요).\n\n- 앱이 여는 주소: %s/report.html\n- 서명: %s\n- SHA-256 지문: %s\n- 빌드: %s\n\n주소창 없이 전체 화면으로 열리려면 서버 환경변수 ANDROID_SHA256_FINGERPRINTS에 위 지문을 넣으세요.' "$SITE_URL" "$KEY_KIND" "$FINGERPRINT" "${{ github.run_number }}")
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "안심ON 안드로이드 앱" --notes "$NOTES" --prerelease --target "${{ github.sha }}"
          gh release edit android-latest --notes "$NOTES"
          gh release upload android-latest out/ansimon.apk out/assetlinks.json --clobber
